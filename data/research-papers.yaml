papers:
  - title: "Deconstructing Xen"
    description: |
      This work systematically analyze the 191 Xen hypervisor vulnerabilities from Xen Security
      Advisories, revealing that the majority are in the core hypervisor not Dom0, and provides
      a novel deconstruction of Xen into a security monitor, a shared service domain, and per-VM
      Xen slices that are isolated by a least-privileged sandboxing framework.
    url: "https://www.semanticscholar.org/paper/Deconstructing-Xen-Shi-Wu/6772a66a3196d23a90bdd849c858ebe763c084a4?utm_source=direct_link"
    publication_date: "2017-02-27"
    tags:
      - hypervisor
      - dom0
      - protection domains

  - title: "NEVE: Nested Virtualization Extensions for ARM"
    description: |
      This paper introduces NEVE, a set of architectural changes to the ARM architecture
      aimed at improving nested virtualization performance. The authors demonstrate that
      NEVE allows hypervisors running real application workloads to achieve significantly
      better performance than current ARM nested virtualization support.
    url: "https://www.cs.columbia.edu/~nieh/pubs/sosp2017_neve.pdf"
    publication_date: "2017-10-28"
    tags:
      - ARM
      - nested virtualization
      - hypervisor

  - title: "Xen and the Art of Virtualization"
    description: |
      This foundational paper introduces Xen, detailing its architecture and performance
      benefits compared to other virtualization techniques. It is pivotal in understanding
      the principles behind paravirtualization.
    url: "https://www.cl.cam.ac.uk/research/srg/netos/papers/2003-xensosp.pdf"
    publication_date: "2003-10-01"
    tags:
      - xen
      - virtualization
      - architecture

  - title: "The Xen Hypervisor and its IO Subsystem"
    description: |
      This paper provides an in-depth look at Xen's I/O subsystem, discussing the challenges
      and solutions related to virtualizing I/O devices within the Xen architecture.
    url: "https://research.ibm.com/haifa/Workshops/systems-and-storage2005/papers/xen-io.pdf"
    publication_date: "2005-06-01"
    tags:
      - xen
      - I/O
      - virtualization

  - title: "Enforcing Performance Isolation Across Virtual Machines in Xen"
    description: |
      Addressing the need for performance isolation in virtualized environments, this work
      explores mechanisms to ensure that virtual machines running on Xen do not interfere
      with each other's performance.
    url: "https://cseweb.ucsd.edu/~dgupta/papers/mware06-xenqos.pdf"
    publication_date: "2006-06-01"
    tags:
      - xen
      - performance
      - isolation

  - title: "Resilient Virtualized Systems Using ReHype"
    description: |
      This study introduces ReHype, a mechanism designed to recover the Xen hypervisor from
      failures transparently to the hosted virtual machines, enhancing system resilience.
    url: "https://arxiv.org/abs/2101.09282"
    publication_date: "2021-01-22"
    tags:
      - xen
      - resilience
      - fault recovery

  - title: "Shedding Light on Static Partitioning Hypervisors for Arm-based Mixed-Criticality Systems"
    description: |
      This paper evaluates static partitioning hypervisors, including Xen's Dom0-less mode,
      focusing on their applicability in Arm-based mixed-criticality systems.
    url: "https://arxiv.org/abs/2303.11186"
    publication_date: "2023-03-20"
    tags:
      - xen
      - arm
      - dom0-less
      - mixed-criticality

  - title: "KASR: A Reliable and Practical Approach to Attack Surface Reduction of Commodity OS Kernels"
    description: |
      Discussing security enhancements, this research presents KASR, implemented on the Xen
      hypervisor, aiming to reduce the attack surface of commodity OS kernels.
    url: "https://arxiv.org/abs/1802.07062"
    publication_date: "2018-02-20"
    tags:
      - xen
      - security
      - kernel

  - title: "Akita: A CPU Scheduler for Virtualized Clouds"
    description: |
      Focusing on CPU scheduling, this paper introduces Akita, a scheduler designed to deliver
      predictable performance in virtualized cloud environments using the Xen hypervisor.
    url: "https://arxiv.org/abs/2009.09104"
    publication_date: "2020-09-18"
    tags:
      - xen
      - scheduling
      - cloud

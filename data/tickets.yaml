tickets:
  inPerson:
    - title: "Early Bird $150"
      price: "$150"
      description: |
        - Available **_until_ June 1, 2025**
        - Access to all presentations
        - Exclusive in-person only design sessions with community experts
        - Access to the partner expo
        - Networking opportunities
      link: "https://register.linuxfoundation.org/xen-summit-2025"
      linkText: "Buy Ticket"

    - title: "Standard $300"
      price: "$300"
      description: |
        - Available **_after_ June 1, 2025**
        - Access to all presentations
        - Exclusive in-person only design sessions with community experts
        - Access to the partner expo
        - Networking opportunities
      link: "https://register.linuxfoundation.org/xen-summit-2025"
      linkText: "Buy Ticket"

    - title: "Academic $50"
      price: "$50"
      description: |
        - Discounted rate for students and faculty (requires verification)
        - All benefits of the standard tickets
        - Learn about the latest in Xen and virtualization
        - Network with industry experts and organizations
        - Participate in a vibrant community
      link: "https://register.linuxfoundation.org/xen-summit-2025"
      linkText: "Buy Ticket"

    - title: "Speaker FREE"
      price: "Free"
      description: |
        - For confirmed speakers only
        - All benefits of the standard tickets
        - Be a part of the Xen Summit community
      link: "https://sessionize.com/xen-summit-2025/"
      linkText: "Become a speaker!"

  virtual:
    - title: "Virtual $150"
      price: "$150"
      description: |
        - Access from anywhere
        - Live stream access
        - Interactive Q&A
      link: "https://register.linuxfoundation.org/zZ42lz"
      linkText: "Buy Ticket"

    - title: "Virtual Academic FREE"
      price: "Free"
      description: |
        - Free for students and faculty (requires verification)
        - All benefits of the virtual ticket
      link: "https://register.linuxfoundation.org/zZ42lz"
      linkText: "Register"

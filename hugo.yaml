baseURL: "https://local.xenproject.org/"

languageCode: "en-us"
title: "Xen Project"
theme: "xen-project"

module:
  hugoVersion:
    extended: true
    min: "0.116.0"

build:
  writeStats: true
  processing:
    css: true
    css:
      includePaths: []
      sourceMap: true
outputs:
  home:
    - HTML
    - RSSoui appelle
    - HEADER
    - FOOTER

outputFormats:
  HEADER:
    mediaType: "text/html"
    baseName: "header"
    isPlainText: true
    rel: "header"
    notAlternative: true
  FOOTER:
    mediaType: "text/html"
    baseName: "footer"
    isPlainText: true
    rel: "footer"
    notAlternative: true

menus:
  main:
    - name: "Projects"
      pageRef: "/projects"
      weight: 10

    - name: "Contribute"
      pageRef: "/contribute"
      weight: 20

    - name: "Documentation"
      pageRef: "/documentation"
      weight: 30
      url: "https://wiki.xenproject.org/wiki/Index_Guide"
      params:
        class: "custom-class"
        target: "_blank"

    - name: "Resources"
      pageRef: "/resources"
      weight: 40
    - name: "Blog"
      parent: "Resources"
      weight: 60
      url: "/blog"
      params:
        class: "custom-class"
        target: "_blank"
    - name: "About"
      url: "/about"
      weight: 50

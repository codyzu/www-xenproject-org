# base config used for production

baseURL: "https://beta.xenproject.org/"

languageCode: "en-us"
title: "Xen Project"
theme: "xen-project"

enableGitInfo: true


params:
  blogApiKey: "b047d7f627a90f40798d11dcba"


minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      keepWhitespace: false
      keepEndTags: false
      keepQuotes: false
      keepComments: false
module:
  hugoVersion:
    extended: true
    min: "0.116.0"

build:
  writeStats: true
  processing:
    css: true
    js:
      targetPath: "js/main.js"
      noHash: true
    css:
      includePaths: []
      sourceMap: true
outputs:
  home:
    - HTML
    - RSS
    - HEADERFOOTER

outputFormats:
  HEADERFOOTER:
    mediaType: "text/html"
    baseName: "headerfooter"
    isPlainText: true
    rel: "headerfooter"
    notAlternative: true

# markup:
#   goldmark:
#     renderer:
#       unsafe: true  

menus:
  main:
    - name: "Projects"
      pageRef: "/projects"
      weight: 10

    - name: "Contribute"
      pageRef: "/contribute"
      weight: 20

    - name: "Documentation"
      pageRef: "/documentation"
      weight: 30
      url: "https://wiki.xenproject.org/"
      params:
        class: "custom-class"
        target: "_blank"

    - name: "Resources"
      pageRef: "/resources"
      weight: 40

    - name: "More"
      pageRef: "/More"
      params:
        header: false
      weight: 100

    - name: "Blog"
      parent: "Resources"
      weight: 60
      url: "/blog"

    - name: "BlogReleases"
      parent: "More"
      params:
        altTitle: "Releases" 
        header: false
      weight: 61
      url: "/blog/tag/releases/"

    - name: "About"
      url: "/about"
      weight: 50
   

    - heading "Conflict Resolution" [level=3]
    - paragraph:
      - text: Sub-projects and teams hosted on Xenproject.org are not democracies but meritocracies. In situations where there is disagreement on issues related to the day-to-day running of the project, the
      - link "project leadership team":
        - /url: /#leadership
      - text: is expected to act as referee and make a decision on behalf of the community. Projects leadership teams can choose to delegate entire classes of conflict resolution issues to community members and/or the project lead (e.g. the project can choose to delegate refereeing on committer disagreements to the project lead; or it could choose a specific committer to always act as referee amongst a group of committers). Any such delegation needs to be approved as normal and has to be documented.
    - paragraph: Should a project leadership team become dysfunctional or paralysed, the project leadership team or project lead should work with the community manager or advisory board to find a way forward.
    - paragraph: In situations where the entire Xen Project community becomes paralysed the impacted project leadership teams or project leads should work with the community manager or advisory board to find a way forward.
    - heading "Elections" [level=3]
    - heading "Maintainer Elections" [level=4]
    - paragraph: Developers who have earned the trust of existing maintainers can be promoted to maintainer. A two stage mechanism is used
    - list:
      - listitem: "Nomination: A maintainer should nominate himself by proposing a patch to the MAINTAINERS file or mailing a nomination to the project’s mailing list. Alternatively another maintainer may nominate a community member. A nomination should explain the contributions of proposed maintainer to the project as well as a scope (set of owned components). Where the case is not obvious, evidence such as specific patches and other evidence supporting the nomination should be cited."
      - listitem: "Confirmation: Normally, there is no need for a direct election to confirm a new maintainer. Discussion should happen on the mailing list using the normal decision making process. If there is disagreement or doubt, the decision is handled by the project leadership."
    - heading "Committer and other Project Leadership Elections" [level=4]
    - paragraph: Developers who have earned the trust of committers in their project can through election be promoted to Committer or Project Leadership (if not covered otherwise). A two stage mechanism is used
    - list:
      - listitem:
        - text: "Nomination: Community members should nominate candidates by posting a proposal to"
        - emphasis: appointments at xenproject dot org
        - text: explaining the candidate’s contributions to the project and thus why they should be elected to become a Committer of the project. The nomination should cite evidence such as patches and other contributions where the case is not obvious. Existing Committers will review all proposals, check whether the nominee would be willing to accept the nomination and publish suitable nominations on the project’s public mailing list for wider community input.
      - listitem:
        - text: "Election: A committer will be elected using the decision making process outlined earlier. In other words, the decision is delegated to the"
        - link "project leadership team":
          - /url: /#leadership
        - text: .
    - heading "Security Response Team Members" [level=4]
    - paragraph: Developers who have earned the trust of other security team members can be promoted to be on the security team. Due to the specific needs of the security team, promotions are typically made by the security team itself and confirmed by lazy consensus within the team.
    - heading "Project Lead Elections" [level=4]
    - paragraph: Projects which have a project lead, should vote for a project lead in an anonymous vote amongst the project leadership.
    - heading "Project Wide Decision Making" [level=3]
    - paragraph:
      - text: Project wide decisions are made through
      - strong: formal global votes
      - text: and are conducted in rare circumstances only, following the principle of
      - link "local decision making":
        - /url: /#principles
      - text: ". Global votes are only needed, when all sub-projects hosted on Xenproject.org are affected. This is true, only for:"
    - list:
      - listitem:
        - text: Specific votes on creating, graduating, completing/archiving of sub-projects as outlined in
        - link "project governance":
          - /url: /#project-governance
        - text: .
      - listitem:
        - text: "Changes to this document, where sub-projects cannot specialise. In particular the sections:"
        - link "goals":
          - /url: /#goals
        - text: ","
        - link "principles":
          - /url: /#principles
        - text: ","
        - link "project wide decision making":
          - /url: /#project-decisions
        - text: and
        - link "project governance":
          - /url: /#project-governance
        - text: (and small parts of
        - link "Xen Project wide roles":
          - /url: /#roles-global
        - text: ","
        - link "project team roles":
          - /url: /#roles-local
        - text: and
        - link "decision making":
          - /url: /#decisions
        - text: that are needed for project governance or
        - strong: apply to all sub-projects
        - text: as stated in those sections).
      - listitem:
        - text: Changes to this document where sub-projects can specialise require at least one mature project other than the Hypervisor project to be impacted significantly by the change. The sections in question, are
        - link "project team roles":
          - /url: /#roles-local
        - text: and
        - link "decision making":
          - /url: /#decisions
        - text: . These sections define the
        - strong: gold standard
        - text: of how the original Hypervisor Project operates. In other cases, the Hypervisor project leadership team can agree changes to these sections, as they are essentially reference definitions. Other sub-projects have to be consulted, and have to be given time to adapt to changes.
      - listitem:
        - text: Changes to existing global namespace policies (e.g.
        - link "Mailing List Conventions":
          - /url: /resources/mailing-lists
        - text: ) and creation of new project wide namespace policies.
      - listitem: "Changes to the boundary of what policies are project local and global decision: e.g. a decision to introduce a global Security Vulnerability Response Process that affects all sub-projects."
    - paragraph: "Global votes are arranged by the community manager when needed (e.g. for a project review or a global process change). Who exactly has input on a proposal and can vote on it, depends on the type of change as outlined below:"
    - table:
      - rowgroup:
        - row "Proposal Who reviews? Who votes?":
          - columnheader "Proposal":
            - strong: Proposal
          - columnheader "Who reviews?":
            - strong: Who reviews?
          - columnheader "Who votes?":
            - strong: Who votes?
      - rowgroup:
        - row "Creating, graduating, completing/archiving of sub-projects Members of developer mailing lists of qualifying projects Leadership teams of mature sub-projects, with the exception of the project which is being reviewed (e.g. for an archivation review, the leadership team of the project under review, cannot vote).":
          - cell "Creating, graduating, completing/archiving of sub-projects"
          - cell "Members of developer mailing lists of qualifying projects"
          - cell "Leadership teams of mature sub-projects, with the exception of the project which is being reviewed (e.g. for an archivation review, the leadership team of the project under review, cannot vote).":
            - text: Leadership teams of
            - strong: mature
            - text: sub-projects, with the exception of the project which is being reviewed (e.g. for an archivation review, the leadership team of the project under review, cannot vote).
        - row "Global Process Changes Members of developer mailing lists of qualifying projects Leadership teams of mature sub-projects, within the scope described above.":
          - cell "Global Process Changes"
          - cell "Members of developer mailing lists of qualifying projects"
          - cell "Leadership teams of mature sub-projects, within the scope described above.":
            - text: Leadership teams of
            - strong: mature
            - text: sub-projects, within the scope described above.
    - paragraph: The community manager first arranges a public review, followed by a timed private vote. Public review and voting should be open for a minimum of a week each. For voting a traceable poll mechanism (e.g. voting form that keeps auditable and tamper proof records) must be used.
    - paragraph:
      - text: Voting is conducted
      - strong: per project
      - text: "in line with the following rules:"
    - list:
      - listitem: Each qualifying project’s vote is counted per project and then aggregated as outlined below.
      - listitem:
        - text: Project leadership team members vote for or against a proposal (there is no differentiation between
        - strong: "-1"
        - text: /
        - strong: "-2"
        - text: and
        - strong: "+1"
        - text: /
        - strong: "+2"
        - text: ). A
        - strong: "0"
        - text: vote is not counted as a valid vote.
      - listitem:
        - text: A
        - strong: quorum of at least least 1/3 of positive votes
        - text: "of each project’s leadership team members is required. In other words: if a project’s leadership team does not achieve the quorum, the entire sub-project’s vote is not counted. This avoids situations where only a minority of leadership team members vote, which would skew the overall result. If it becomes clear, that a sub-project is not likely to meet the quorum, the voting deadline can be extended by the community manager."
    - paragraph:
      - strong: "Passed/Failed Resolutions:"
    - list:
      - listitem: If none of the qualifying projects achieve a quorum, the change cannot hold. In that case, we consider that there is not enough momentum behind a change.
      - listitem: For each qualifying project with a quorum, the percentage of votes in favour and against is calculated (e.g. if 5 people voted in favour, 2 against and 1 abstains, the share is 5/7th and 2/7th respectively).
      - listitem: Votes in favour are averaged as percentages across all projects (say we have per project figures of 50%, 80%, 70% in favour, then the total vote in favour is 66.67%).
      - listitem: If the total vote achieves a 2/3rd majority in favour, the proposal passes. Otherwise it fails.
    - heading "Community Decisions with Funding and Legal Implications" [level=2]
    - paragraph:
      - text: In some cases sub-project local and global decisions
      - strong: may require input
      - text: from the
      - link "Advisory Board":
        - /url: /#roles-ab
      - text: and/or the
      - link "Linux Foundation":
        - /url: /#roles-lf
      - text: . For example, if a proposal by a project leadership team or a global project decision requires that the project hires a staff member or contractor (e.g. a PR consultant, marketing manager) or requires the funding of new infrastructure (e.g. additional test hardware or services) to implement said proposal, then funding would need to be secured from the Advisory Board or from other sources.
    - paragraph: If for example, a community proposal required the Linux Foundation to sign a legal agreement with a 3rd party on behalf of the project/sub-project, then of course a review of such an agreement and a signature by the Linux Foundation would be required.
    - paragraph: In such cases, the impacted project leadership team(s) will contact the Community Manager and/or Advisory Board to resolve possible issues.
    - heading "Project Governance" [level=2]
    - heading "Basic Project Life Cycle" [level=3]
    - paragraph: "The proposal is to follow a simple basic flow:"
    - paragraph
    - paragraph: A Xenproject.org hosted project starts with an idea which through the process of project formation will grow into a project proposal. The project proposal will need to satisfy some basic conditions, will be put out for community review and is then put to a vote to all maintainers and project leads of mature sub-projects hosted on Xenproject.org following the usual decision making process.
    - paragraph: For agreed project proposals, the Xen Project will provide basic infrastructure and the project can get started. Sub-projects in incubation are working towards a set of goals, will get additional support and marketing opportunities from the Xen Project. However there will also be regular checkpoints to see whether the project is progressing. Should it turn out that a project is not viable any more, it will be archived after an archivation review and vote. For a project to graduate, some basic conditions must be satisfied. If a project in incubation has achieved the point where it believes it is mature enough to graduate, it can request a Graduation community review followed by a vote.
    - paragraph: Mature projects are pretty much expected to run themselves. However at some point a mature project will lose momentum and developers. If this is the case the Xen Project community can request an archivation review, which follows the usual pattern.
    - paragraph: "Archivation reviews have two purposes:"
    - list:
      - listitem: give somebody in the community an opportunity to step up and continue a project,
      - listitem: archive the project outcomes such that they are still available to people who want to use them, but promotion of such projects will cease.
    - paragraph: It is also possible to revive archived projects. However these are treated almost like new projects as projects would only be archived if they have become inactive.
    - heading "Requesting Reviews, Reviews and Voting" [level=3]
    - paragraph:
      - strong: "Requesting Reviews:"
      - text: Project Proposal and Graduation Reviews are requested by the (prospective) project lead of the project by contacting the community manager providing the necessary documentation. An archivation review can be requested by any maintainer of a mature project or by the Xen Project community manager. The community manager will then publish relevant material on the respective mailing lists.
    - paragraph:
      - strong: "Reviews:"
      - text: "These are off-line reviews which are open to all community members by which a proposal is published for review. The purpose of the review is two-fold:"
    - list:
      - listitem: gather final feedback and input from the community (it is good practice to informally do this before the review),
      - listitem: advertise the project with the aim to attract interest, users and contributors.
    - paragraph: After a review, the requester of the review may decide to withdraw, request a re-review or progress to a vote by arranging with the community manager.
    - paragraph:
      - strong: "Voting:"
      - text: The community manager arranges a timed private vote as outlined in
      - link "Formal Votes":
        - /url: /#project-decisions
      - text: .
    - heading "Forming a Project" [level=3]
    - paragraph: "Requirements for forming a sub-project or team on Xenproject.org:"
    - list:
      - listitem: A project needs a lead, who is willing to become the project lead of the sub-project
      - listitem: A project needs a sponsor, which can be a project lead of a mature project, a member of the Xen Project Advisory Board or the community manager
      - listitem: "There should be no dissent from other community members who would qualify as sponsor (see “Principle: Consensus Decision Making”)"
      - listitem: A project needs a mentor, which can be the project sponsor or a maintainer of a mature project
      - listitem: A project needs to have a relationship to other sub-projects or teams, i.e. it aims to develop software that has a dependency on other sub-projects or teams hosted on Xenproject.org. If the project needs components in other sub-projects to work, then this should also be stated.
      - listitem: A project needs to be large and long-term enough to grant a separate project. For example adding support for a new CPU architecture, adding additional functionality on top of existing projects, etc. Adding a new feature to an existing project should be performed within an existing project.
      - listitem: A project will deliver code using a license that is compatible with other sub-projects hosted on Xenproject.org (ideally GPLv2).
    - paragraph: The purpose of the project formation phase is to work out what the project is about, get community buy-in and help the future project gain publicity and momentum. The formation phase is driven by the project lead. The project mentor’s role is to advise and support the project lead in getting the project started.
    - paragraph:
      - text: The project proposal is a document that describes and is published on
      - link "wiki.xenproject.org":
        - /url: http://wiki.xenproject.org
      - text: ":"
    - list:
      - listitem: What the project is aiming to achieve (i.e. the project charter and project goals)
      - listitem: What components/code and in which code lines (new or components in other projects) the project aims to deliver
      - listitem: Key dependencies on other sub-projects or teams hosted on Xenproject.org (if applicable)
      - listitem: Lists initial maintainers (if applicable)
      - listitem: Lists any interested parties in the project (if applicable)
      - listitem: Lists any planned initial code contributions (if applicable)
      - listitem: A rough plan on how to get through the Incubation phase
    - heading "Project Proposal Review" [level=3]
    - paragraph: The review is initiated by the project lead and follows the rules outlined in “Requesting Reviews, Reviews and Voting”.
    - paragraph: "After a successful review, the following resources will be created for the project:"
    - list:
      - listitem: A mailing list
      - listitem: A codeline
      - listitem: A sub-project or team portal on Xenproject.org (in an area separate from mature projects)
      - listitem:
        - text: A wiki page on
        - link "wiki.xenproject.org":
          - /url: http://wiki.xenproject.org
        - text: (this is expected to be maintained by the project lead)
    - heading "Incubating a Project" [level=3]
    - paragraph: The purpose of the incubation phase is for a project to show that it is gathering momentum and adheres to the “Principles & Roles” of sub-projects hosted on Xenproject.org. The project mentor will work closely with the project lead and there are at least quarterly informal review meetings with the mentor on how the project is doing. Should a mentor not be able to fulfil his/her role any more, it is the responsibility of the project lead to find another mentor. We advise that the project lead gives at least quarterly updates on the Xen Project blog on how the project is doing.
    - paragraph: The Xen Project will provide support to incubating projects. The project lead will work closely with the Xen Project community manager as well as with the project mentor.
    - heading "Archiving an Incubating project" [level=3]
    - paragraph: The mentor can request for a project to be archived, if the project is not making sufficient progress. See “archivation review”.
    - heading "Graduation Review" [level=3]
    - paragraph: The review is initiated by the project lead and follows the rules outlined in “Requesting Reviews, Reviews and Voting”. In essence the project lead makes a pitch to the community, why the project should graduate.
    - paragraph: "A project must fulfil the following requirements before it can graduate:"
    - list:
      - listitem: It follows the principles of openness, transparency and meritocracy
      - listitem: It has delivered at least one functioning release of what it is aiming to deliver
      - listitem: It has a public code line which shows active development and has mechanisms to accept patches (and a history of accepting patches)
      - listitem: It has a public mailing list that is active (as we get more experience we will add some guidelines)
      - listitem: It has a mechanism for users to raise bugs and for developers to work on bugs
      - listitem: It has an active developer community (as we get more experience we will add some guidelines). But things to look for are number of maintainers, different organisations involved, number of users, etc.
      - listitem: It has a project leadership team that resolves conflicts and participates in cross-project decision making
      - listitem: It adheres to the Xen Project governance as outlined in this document, or documents areas where the sub-project differs
    - paragraph: "Other items to look at during the review (depending on project are):"
    - list:
      - listitem: It has an up-to-date wiki and a core and group of people maintaining it
      - listitem: It publishes regular builds and tests
      - listitem: It promotes itself at events and on the blog
    - heading "Mature Projects" [level=3]
    - paragraph: Mature projects are expected to be run and promote themselves. The project leadership team and/or project lead has significant responsibility in ensuring that this happens. The Xen Project and the community manager will help organize events, provide opportunities for the project to get new contributors and build a community, promote new releases on the blog and to the press, work with project members, etc. However the Xen Project and the community manager will not get involved in the day-to-day running of the project.
    - paragraph: At some point during its life cycle a project may lose momentum. In other words developers and users are not interested in the project any more. If this is the case, it may be time to archive the project. If the project has achieved its goals and is thus completed, it may also be time to archive the project.
    - heading "Archivation Review" [level=3]
    - paragraph: "These can happen in a number of situations:"
    - list:
      - listitem: An incubation project shows clear signs of failing and not progressing
      - listitem: A mature project has lost its developer and user base (and there is little or no activity)
      - listitem: "The project has achieved its goals and/or fulfilled its charter: in other words it has completed"
    - paragraph: In the first case the review is triggered by the incubation project’s mentor. Failing this the review can be requested by any maintainer of a mature project (including the project’s lead) or by the Xen Project community manager. See “Requesting Reviews, Reviews and Voting”.
    - paragraph: "The review is essentially a pitch why the project should be archived. The purpose of the review is not necessarily to archive a project, but also to provide a last opportunity for interested parties in the Xen Project community to save the project and step up. The Xen Project community manager will support efforts to save the project, should community members want to step up. There is the special case that a project has been completed: in this case the normal situation would be for the project lead to make the case, why this is so."
    - heading "Archived Projects" [level=3]
    - paragraph: "When a project is archived the following happens:"
    - list:
      - listitem: The codeline and mailing list will be made read-only and made accessible from an archived projects section on Xenproject.org
      - listitem:
        - text: The project’s wiki pages will be tagged as
        - strong: archived
        - text: . A project may be completed (i.e. it has achieved its goals and/or fulfilled its charter) in which case it is tagged as
        - strong: completed
        - text: and
        - strong: archived
        - text: .
      - listitem:
        - text: The project or team portal on Xenproject.org will be moved into an
        - strong: Archive
        - text: section. We may have a
        - strong: Completed
        - text: section within the
        - strong: Archive
        - text: section.
    - paragraph: In cases where the project has delivered code into other sub-projects hosted on Xenproject.org, the code will be
    - list:
      - listitem: Deprecated at the point where the project is archived
      - listitem: The project which now contains the archived code can (but does not have to) remove the code in a subsequent release (it should however give users sufficient time to adapt)
    - heading "Exceptional Circumstances" [level=3]
    - heading "Incubation Projects without Project Lead" [level=4]
    - paragraph:
      - text: Projects which lose their project lead during the incubation phase, and do not have a working project leadership team, are at risk of failing. Should this occur, the project’s maintainer or committer community should nominate a new project lead and follow the election process as outlined in
      - link "elections":
        - /url: /#elections
      - text: .
    - paragraph: If a project lead leaves during the formation phase, without finding a successor we assume that the project does not have enough momentum and will consider archiving the project.
    - heading "Projects without functional Project Leadership Team" [level=4]
    - paragraph:
      - text: Projects which lose their project leadership team, or whose project leadership team is too small to function, are at risk of failing. A project leadership team should be of sufficient size to manage the project. Should this occur, the project’s maintainer or committer community should nominate new leadership team members and follow the election process as outlined in
      - link "elections":
        - /url: /#elections
      - text: .
    - paragraph: If the community cannot create a functional leadership team, we assume that the project does not have enough momentum and will consider archiving the project.
    - heading "Incubation projects without Mentor" [level=4]
    - paragraph: Should an incubation project lose its mentor, the Xen Project community manager will support the project lead in finding a new mentor.
    - heading "Per Sub-Project Governance Specialisation" [level=2]
    - paragraph: Add specialisations to this section, as they surface.

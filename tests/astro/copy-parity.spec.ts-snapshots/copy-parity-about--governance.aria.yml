- main:
  - complementary:
    - heading "Resources" [level=3]
    - list:
      - listitem:
        - link "Governance ":
          - /url: https://xenbits.xenproject.org/governance/core-governance.html
  - article:
    - heading "Governance" [level=1]
    - text: Learn how the Xen Project governs open technical decisions, project roles, the Advisory Board, and Safety Committee coordination.
    - heading "Goals" [level=2]
    - paragraph: "The goals of Xen Project Governance are to:"
    - list:
      - listitem: Create a set of minimum requirements for a sub-project hosted on Xenproject.org
      - listitem:
        - text: Create a lightweight project life cycle that
        - list:
          - listitem: leads the project to articulate its goals and how to achieve them
          - listitem: encourages desired behaviours (e.g. open development)
          - listitem: provides motivation for the project to succeed
          - listitem: leads to non-viable projects failing quickly
          - listitem: provides opportunities for other community members
      - listitem: Avoid bureaucracy, i.e. the life cycle should be as informal as possible
      - listitem: Encourage Xen related projects to be hosted on Xenproject.org rather than going elsewhere
      - listitem: Set clear expectations to vendors, upstream and downstream projects and community members
    - heading "Principles" [level=2]
    - heading "Openness" [level=3]
    - paragraph: The Xen Project is open to all and provides the same opportunity to all. Everyone participates with the same rules. There are no rules to exclude any potential contributors which include, of course, direct competitors in the marketplace.
    - heading "Transparency" [level=3]
    - paragraph: Project discussions, minutes, deliberations, project plans, plans for new features, and other artefacts are open, public, and easily accessible.
    - heading "Meritocracy" [level=3]
    - paragraph: The Xen Project is a meritocracy. The more you contribute the more responsibility you will earn. Leadership roles in Xen are also merit-based and earned by peer acclaim.
    - heading "Local Decision Making" [level=3]
    - paragraph: "The Xen Project consists of a number of sub-projects: each sub-project makes technical and other decisions that solely affect it locally."
    - heading "Xen Project Wide Roles" [level=2]
    - heading "Sub-projects and Teams" [level=3]
    - paragraph:
      - text: The Xen Project organizes itself into a number of sub-projects, which follow the
      - link "Project Governance":
        - /url: /#project-governance
      - text: (or Project Lifecycle) as outlined in this document. Sub-projects (sometimes simply referred to as projects) are run by individuals and are often referred to as teams to highlight the collaborative nature of development. For example, each sub-project has a
      - link "team portal":
        - /url: /projects/all-projects
      - text: ) on Xenproject.org. Sub-projects own and are responsible for a collection of source repositories and other resources (e.g. test infrastructure, CI infrastructure, …), which we call
      - strong: sub-project assets
      - text: (or team assets) in this document.
    - paragraph:
      - text: Sub-projects can either be
      - strong: incubation projects
      - text: or
      - strong: mature projects
      - text: as outlined in
      - link "Basic Project Life Cycle":
        - /url: /#basic-project-life-cycle
      - text: . In line with the meritocratic principle, mature projects have more influence than incubation projects, on
      - link "project wide decisions":
        - /url: /#project-wide-decision-making
      - text: .
    - heading "Community Manager" [level=3]
    - paragraph: The Xen Project has a community manager, whose primary role it is to support the entire Xen Project Community.
    - heading "Xen Project Advisory Board" [level=3]
    - paragraph:
      - text: The
      - link "Xen Project Advisory Board":
        - /url: /about/become-a-member
      - text: consists of members who are committed to steering the project to advance its market and technical success, and who serve as positive ambassadors for the project. The Xen Project Advisory Board manages non-technical aspects of the Xen Project including funding for shared project infrastructure, marketing and events, and managing the Xen Project trademark. The Advisory Board leaves all technical decisions to the open source meritocracy.
    - heading "Xen Safety Committee" [level=3]
    - paragraph: The Xen Safety Committee is a formal project committee that coordinates certification-oriented processes and committee-managed safety artifacts. Premier Plus members appoint voting representatives to both the Xen Project Advisory Board and the Safety Committee, participate directly in committee work, and help set priorities and roadmap. Upstream technical decisions continue through Xen’s established open contribution, maintainer review, and project governance processes. The committee does not replace maintainer review, and membership does not confer technical authority.
    - paragraph:
      - link "Explore safety engineering":
        - /url: /technology/safety
      - text: or
      - link "explore Premier Plus membership":
        - /url: /about/become-a-member
      - text: .
    - heading "The Linux Foundation" [level=3]
    - paragraph:
      - text: The Xen Project is a
      - link "Linux Foundation":
        - /url: https://www.linuxfoundation.org/
      - text: Collaborative Project. Collaborative Projects are independently funded software projects that harness the power of collaborative development to fuel innovation across industries and ecosystems. By spreading the collaborative DNA of the largest collaborative software development project in history, The Linux Foundation provides the essential collaborative and organizational framework so projects can focus on innovation and results.
    - heading "Mentor" [level=3]
    - paragraph: Younger projects may have a need for a mentor to help ensure that the project will be successful. Mentors can be maintainers, project leads, advisory board members or other distinguished community members.
    - heading "Sponsor" [level=3]
    - paragraph: To form a new sub-project or team on Xenproject.org, we require a sponsor to support the creation of the new project. A sponsor can be a member of the project leadership team of a mature project, a member of the advisory board or the community manager. This ensures that a distinguished community member supports the idea behind the project.
    - heading "Project Team Roles" [level=2]
    - paragraph:
      - text: Sub-projects or teams are driven by the people who volunteer for the job. This functions well for most cases. This section lists the main roles which projects use. This section lists the default roles, which are based on how the Hypervisor project operates. Sub-projects can deviate from the default, but are required to document deviations from the default and link to it from this
      - link "document":
        - /url: /#per-sub-project-governance-specialisation
      - text: . The only exception is that each project is required to have a project leadership team, as without it, the project will not be able to function.
    - paragraph:
      - text: The following table lists how each project uses these roles. Note that
      - strong: incubation projects
      - text: have more flexibility in experimenting with roles that work for them, but need to define specializations before they can
      - strong: mature
      - text: .
    - table:
      - rowgroup:
        - row "Project Mature Maintainers Committers Security Team Leadership Team":
          - columnheader "Project"
          - columnheader "Mature"
          - columnheader "Maintainers"
          - columnheader "Committers"
          - columnheader "Security Team"
          - columnheader "Leadership Team"
      - rowgroup:
        - row "Hypervisor YES YES YES YES Committers and Release Manager, without a Project Lead":
          - cell "Hypervisor":
            - strong: Hypervisor
          - cell "YES"

          - cell "Committers, with a Project Lead"
    - heading "Maintainers" [level=3]
    - paragraph: Maintainers own one or several components in the sub-projects source tree(s). A maintainer reviews and approves changes that affect their components. It is a maintainer’s prime responsibility to review, comment on, co-ordinate and accept patches from other community member’s and to maintain the design cohesion of their components. Maintainers are listed in a MAINTAINERS file in the root of each code repository that the project owns.
    - paragraph: Larger sub-projects such as the Hypervisor may have special maintainer roles such as a release manager and stable branch maintainers. In addition, larger projects may award different maintainers different levels of influence. Any specialisations and implications are documented in the respective MAINTAINERS file.
    - heading "Committers" [level=3]
    - paragraph:
      - text: Committers are Maintainers that are allowed to commit changes into the source code repository. The committer acts on the wishes of the maintainers and applies changes that have been approved by the respective maintainer(s) to the source tree. Due to their status in the community, committers can also act as referees should disagreements amongst maintainers arise. Committers are listed on the sub-project’s team portal (e.g.
      - link "Hypervisor team portal":
        - /url: /projects/hypervisor
      - text: ) and/or in the projects MAINTAINERS files.
    - 'heading "Security Response Team (short: Security Team)" [level=3]'
    - paragraph:
      - text: Each sub-project may have a security response team, that is responsible for receiving, reviewing, and responding to security incident reports for the sub-projects assets according to its security response process (e.g.
      - link "Hypervisor Security Problem Response Process":
        - /url: /about/security-policy
      - text: ).
    - heading "Project Leadership Team and Project Lead" [level=3]
    - paragraph:
      - text: Sub-projects and teams hosted on Xenproject.org are managed by a Project Leadership Team. The leadership team is made up of distinguished community members, but the exact composition may depend on the sub-project. For example, in the case of the Hypervisor sub-project, all committers and the release manager, are part of the leadership team. The leadership team owns the sub-projects processes, the overall architecture and all assets within the project and makes
      - link "sub-project wide decisions":
        - /url: /#leadership-team-decisions
      - text: on behalf of its community.
    - paragraph:
      - text: A sub-projects leadership team members are listed on the sub-project’s team portal (e.g.
      - link "Hypervisor team portal":
        - /url: /projects/hypervisor
      - text: ).
    - paragraph:
      - text: The Leadership Team may elect a Project Lead who is also a member of the Leadership Team. Project Leads are the public figurehead of the project and are responsible for the health of the project. Project Leads can also act as
      - link "referees":
        - /url: /#conflict-resolution
      - text: should the Project Leadership Team become paralysed.
    - heading "Making Contributions" [level=2]
    - paragraph:
      - text: Making contributions in Xen follows the conventions as they are known in the Linux Kernel community. In summary contributions are made through patches that are reviewed by the community. Xen does not require community members to sign contribution or committer agreements. We do require contributors to sign contributions using the sign-off feature of the code repository, following the same approach as the Linux Kernel does (see
      - link "Developer Certificate Of Origin":
        - /url: http://elinux.org/Developer_Certificate_Of_Origin
      - text: ).
    - paragraph: "More information on making contributions can be found in the following documents:"
    - list:
      - listitem:
        - link "Contribution Guidelines":
          - /url: /contribute/contribution-guidelines
      - listitem:
        - link "Review Then Commit Policy":
          - /url: /#review-then-commit
    - heading "Decision Making, Conflict Resolution, Role Nominations and Elections" [level=2]
    - paragraph:
      - text: Sub-projects or teams hosted on Xenproject.org are normally auto-governing and driven by the people who volunteer for the job. This functions well for most cases. This section lists the main mechanisms by which projects make decisions. This section lists the default mode of operation, which is based on how the Hypervisor project operates. Sub-projects can deviate from the default, but are required to document deviations from the default and link to it from this
      - link "document":
        - /url: /#per-sub-project-governance-specialisation
      - text: . The only exception is that each project is required to adhere to the
      - strong: Review Then Commit Policy
      - text: ","
      - strong: Leadership Team Decisions
      - text: and
      - strong: Conflict Resolution
      - text: .
    - heading "Review Then Commit" [level=3]
    - paragraph: "The vast majority of technical decisions within the Xen Project are code related decisions (e.g. patches and design documents), which determine whether a specific change can be accepted into the code base. The default decision making process is a review and commit process, which requires that all changes receive explicit approval from respective code owners (maintainers) before they are committed. The exact workflow and details of this policy between sub-projects may differ and are documented in one or several of the following places: MAINTAINERS/README/CONTRIBUTING files in repositories and/or the sub-project team portal."
    - heading "Expressing Agreement and Disagreement" [level=3]
    - paragraph: Within the community, we follow the following number notation to explicitly express opinions on proposals, formal or informal votes.
    - list:
      - listitem:
        - strong: "+2"
        - text: ": I am happy with this proposal, and I will argue for it"
      - listitem:
        - strong: "+1"
        - text: ": I am happy with this proposal, but will not argue for it"
      - listitem:
        - strong: "0"
        - text: ": I have no opinion"
      - listitem:
        - strong: "-1"
        - text: ": I am not happy with this proposal, but will not argue against it"
      - listitem:
        - strong: "-2"
        - text: ": I am not happy with this proposal, and I will argue against it"
    - paragraph:
      - text: A
      - strong: "-2"
      - text: should include an alternative proposal or a detailed explanation of the reasons for the negative opinion. A
      - strong: "+2"
      - text: should include reasons for the positive opinion.
    - paragraph: "How we tally results and their implications depend on the context in which is is used and are marked with Passed/Failed: in one of the following sections:"
    - list:
      - listitem:
        - link "Lazy Consensus / Lazy Voting":
          - /url: /#lazy-consensus--lazy-voting
      - listitem:
        - link "Leadership Team Decisions":
          - /url: /#leadership-team-decisions
      - listitem:
        - link "Project Wide Decision Making":
          - /url: /#project-wide-decision-making
    - heading "Lazy Consensus / Lazy Voting" [level=3]
    - paragraph: Lazy Consensus is a useful technique to make decisions for specific proposals which are not covered by the Review Then Commit Policy or do not require a more formal decision (see below). Lazy Consensus is extremely useful, when you don’t anticipate any objections, or to gauge whether there are objections to a proposal. The concrete process in this section is a mixture between Lazy Consensus and Lazy Voting and is designed to avoid unnecessary multiple stages in decision making.
    - paragraph: "To make use of it, post something like the following on the project’s mailing list (or some other communication channel):"
    - figure:
      - code: "I am assuming we are agreed on X and am going to assume lazy consensus: if there are no objections within the next seven days."
      - button "Copy to clipboard"
    - paragraph:
      - text: You should however ensure that all relevant stake-holders which may object are explicitly CC’ed, such as relevant maintainers or committers, ensure that
      - strong: lazy consensus
      - text: is in the body of your message (this helps set up mail filters) and choose a reasonable time-frame. If it is unclear who the relevant stake-holders are, the project leadership can nominate a group of stake-holders to decide, or may choose to own the decision collectively and resolve it.
    - paragraph:
      - text: Objections by stake-holders should be expressed using the
      - link "conventions above":
        - /url: /#expressing-agreement-and-disagreement
      - text: to make disagreements easily identifiable.
    - paragraph:
      - strong: "Passed/Failed:"
      - text: The proposer of Lazy Consensus decision is assumed to implicitly have an opinion of
      - strong: "+1"
      - text: ", unless otherwise stated."
    - list:
      - listitem:
        - text: "Failed: A single"
        - strong: "-2"
        - text: by a stake-holder whose approval is necessary
      - listitem:
        - text: "Failed: A total sum of opinions"
        - strong: <=0
      - listitem:
        - text: "Passed: A total sum of opinions"
        - strong: ">0"
    - paragraph:
      - text: It can only be overturned if the project leadership agrees collectively, that the decision is too important to be settled by lazy consensus / lazy voting. In situations where a proposal is failed, an alternative solution needs to be found, or if a decision is formally challenged,
      - link "conflict resolution mechanisms":
        - /url: /#conflict-resolution
      - text: may need to be used to resolve the situation.
    - paragraph:
      - strong: "Further Examples:"
      - text: A Lazy Consensus decision starts out with the implicit
      - strong: "+1"
      - text: opinion of the proposer. If there is no explicit response, the proposal passes as the sum is
      - strong: ">0"
      - text: .
    - paragraph:
      - text: If there is a single
      - strong: "-1"
      - text: without any
      - strong: +
      - text: votes, the proposal fails.
    - paragraph:
      - text: If there are multiple
      - strong: "+1"
      - text: ’s or
      - strong: "+2"
      - text: ’s, more
      - strong: "-1"
      - text: ’s than positive votes are needed for the proposal to fail. This mechanism, is often also called
    - paragraph:
      - strong: Lazy Voting
      - text: .
    - paragraph:
      - text: The process does allow for a proposer to state a starting opinion of
      - strong: "0"
      - text: or
      - strong: "-1"
      - text: . In this case, the Lazy Consensus label does not work for the process, as positive opinions are needed for the proposal to pass. To make use of this mechanism, post something like the following on the project’s mailing list (or some other communication channel)
    - figure:
      - code: "I want to solicit opinions on X and am going to assume lazy voting: My starting position is 0, as I feel that at least one other stake-holder should agree with the proposal.If there is a majority in favour, without a -2 objection within the next seven days, I assume that the proposal holds and does not need require further discussion."
      - button "Copy to clipboard"
    - paragraph:
      - text: Unlike in the lazy consensus case, a single
      - strong: "+1"
      - text: vote is needed. Otherwise the proposal fails. Otherwise, the counting rules follow the general case.
    - paragraph:
      - text: This can be useful in situations, where the proposer is not quite sure about his/her position, or where the invoker acts on behalf of the community to resolve a discussion which has become stuck. A starting position of
      - strong: "-1"
      - text: "can be used to verify that a specific approach may be a bad idea: whether this is really useful, has to be verified as we start using this process."
    - heading "Informal Votes or Surveys" [level=3]
    - paragraph:
      - text: Generally the Xen Project community tries to achieve consensus on most issues. In situations where several concrete options are possible, community members may organize an informal vote on the different proposals and use the
      - link "conventions above":
        - /url: /#expressingopinion
      - text: to identify the strongest proposal. Once the strongest candidate has been identified,
      - link "lazy consensus":
        - /url: /#lazyconsensus
      - text: "could be used to close the discussion. In some situation, a specific survey may need to be created, to help identify gauging consensus on specific issues. For informal votes and surveys, we do not prescribe specific rules, as they are non-binding: it is up to the organizer of an informal vote or survey to interpret the result and explain it to the community. If the vote/survey relates to an area that is owned by the project leadership, the project leadership has to formally confirm the decision."
    - paragraph:
      - text: Note that informal votes amongst a small set of stake-holders that disagree on a position during technical disagreements in code, design reviews and other discussions can be useful. In technical discussions it is not always clear how strong agreement or disagreement on a specific issue is. Using the
      - link "conventions above":
        - /url: /#expressingopinion
      - text: ", can help differentiate between minor and major disagreements and reduce the time a discussions continues unnecessarily. This is true in particular for cases, where several maintainers may need to agree to a proposal."
    - paragraph: When having an informal vote or survey, they creator should consider whether conducting a vote or survey in public, may be divisive and damaging for the community. In such cases, the vote/survey should be conducted anonymously.
    - heading "Leadership Team Decisions" [level=3]
    - paragraph: "Each sub-project has a leadership team, which is typically made up of the most senior and influential developers within the sub-project (e.g. the project’s committers). The project leadership team owns decisions, such as:"
    - list:
      - listitem: Sub-project wide policy decisions (e.g. policies, procedures and processes whose scope is specific to the sub-projects). This includes deviations from project global governance, where permissible.
      - listitem: Decisions related to sub-project assets that are not clearly owned (e.g. unowned code, project wide assets such as test infrastructure, etc.).
      - listitem:
        - text: Decisions related to nominating and confirming leadership roles within the sub-project. This includes
        - link "decisions to creating and filling specialised new roles":
          - /url: /#elections
        - text: ", such as release managers or similar, including their scope and set of responsibilities."
      - listitem:
        - text: Resolving
        - link "conflicts":
          - /url: /#conflict
        - text: within the sub-project that cannot otherwise be resolved.
    - paragraph:
      - text: Leadership team decisions can be made in private (e.g. a private IRC meeting, on a private mailing list, through a private vote) or on a public mailing list using
      - link "decision making conventions":
        - /url: /#expressingopinion
      - text: . If a decision is made in private, the outcome must be summarized in terms of number of votes in favour or against on a public mailing list. Decisions should
      - strong: not
      - text: generally be made in an anonymous vote, unless there is a good reason to do so. For example, if the decision may be divisive and damage the cohesion of the leadership team, an anonymous vote is preferred. In such cases, the leadership team, can ask the community manager, to arrange an anonymous vote on behalf of the leadership team.
    - paragraph:
      - text: Decisions (also called Resolutions) require a
      - strong: 2/3rd
      - text: majority amongst active leadership team members in favour of a proposal. The tallying of votes follows the rules outlined below. Note that a minimum of 3 leadership team members is needed for a
      - link "leadership team to function":
        - /url: /#exceptional-circumstances
      - text: .
    - paragraph:
      - text: "Leadership team decisions normally have to be made actively: in other words each team member has to cast a vote"
      - strong: explicitly
      - text: expressing their opinion. The only exception are face-2-face or on-line meetings with a quorum of
      - strong: 2/3rd
      - text: "of active leadership team members present at the meeting: in such cases a meeting chair is required who calls for decision on a resolution and asks for objections. This allows to conduct meetings more quickly."
    - paragraph:
      - strong: "Passed/Failed Resolutions:"
    - paragraph: "Voting is conducted in line with the following rules:"
    - list:
      - listitem:
        - text: Project leadership team members vote for (
        - strong: "+1"
        - text: ) or against (
        - strong: "-1"
        - text: ) a resolution. There is no differentiation between
        - strong: "+1"
        - text: /
        - strong: "+2"
        - text: and
        - strong: "-1"
        - text: /
        - strong: "-2"
        - text: ": in other words a"
        - strong: "+2"
        - text: is counted as a vote for, a
        - strong: "-2"
        - text: as a vote against the resolution. The number of votes for and against a resolution is called
        - strong: active vote
        - text: .
        - strong: "0"
        - text: votes
        - strong: are not counted
        - text: as an active vote.
      - listitem:
        - text: A
        - strong: quorum of at least 1/3 of positive votes for a proposal
        - text: is required for a resolution to pass. In other words, if the leadership team has 7 members, at least 3 members need to vote for the resolution.
      - listitem: The resolution passes, if a 2/3 majority of active votes is in favour of it.

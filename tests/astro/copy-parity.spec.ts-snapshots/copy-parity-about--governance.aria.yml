    - heading "Code of Conduct" [level=2]
    - paragraph:
      - text: The Xen Project is committed to making participation in our community a harassment-free experience for everyone, regardless of age, body size, disability, ethnicity, sex characteristics, gender identity and expression, level of experience, education, socio-economic status, nationality, personal appearance, race, religion, or sexual identity and orientation. Please review the Code of Conduct
      - link "here":
        - /url: http://xenbits.xenproject.org/governance/code-of-conduct.html
      - text: .
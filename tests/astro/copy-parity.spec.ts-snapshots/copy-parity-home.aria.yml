    - text: A Linux Foundation Project
    - heading "Bring the power of open virtualization everywhere." [level=1]:
      - text: Bring the power of
      - strong: open virtualization
      - text: everywhere.
    - paragraph: The Xen Project team is a global open source community that develops the Xen Project Hypervisor and its associated subprojects.
    - paragraph: Our mission is to advance virtualization technology across a wide range of commercial and open-source domains.
    - img "Illustration of a computer monitor displaying bar charts with Xen Project Logo"
    - list:
      - listitem:
        - heading " Open-source" [level=2]
        - paragraph: Wide variety of vendors and individuals opens new opportunities for the hypervisor and provides end-users with numerous places to find support.
      - listitem:
        - heading " Reliable" [level=2]
        - paragraph: Over 10 million people use Xen with an ecosystem of more than 2000 commercially certified partners.
      - listitem:
        - heading " Flexible" [level=2]
        - paragraph: Architecture enables vendors to create Xen-based products and services for servers, cloud, desktop, embedded, and security-first environments.
      - listitem:
        - heading " Support" [level=2]
        - paragraph: Hypervisor supports multiple guest operating systems and cloud platforms.
      - listitem:
        - heading " Secure" [level=2]
        - paragraph: Minimal attack surface with key security features like KCONFIG and Virtual Machine Introspection.
      - listitem:
        - heading " Modular" [level=2]
        - paragraph: Architecture enables a degree of scalability, robustness, and security suitable for large, critical, and extremely secure environments.
    - heading "A virtualization revolution" [level=2]:
      - text: A virtualization
      - strong: revolution
    - paragraph: "The Xen Project focuses on revolutionizing virtualization by providing a versatile and powerful hypervisor that addresses the evolving needs of diverse industries :"

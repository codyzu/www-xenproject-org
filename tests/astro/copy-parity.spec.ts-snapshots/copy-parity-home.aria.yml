- main:
  - paragraph: A Linux Foundation Project
  - heading "Open source virtualization for systems that demand isolation and control." [level=1]
  - paragraph: Xen is a hypervisor and open source project for teams building infrastructure, embedded platforms, security-sensitive systems, and virtualization products that need a clear layer of separation.
  - link "Explore Xen":
    - /url: /projects/hypervisor
  - link "Explore membership":
    - /url: /about/become-a-member
  - img "Exploded Xen architecture scene showing applications above guest systems, a thin luminous Xen hypervisor layer, and a substantial hardware platform foundation."
  - paragraph: Built in the Open
  - heading "A project you can evaluate in the open." [level=2]
  - paragraph: Governance, security handling, and testing resources are published so technical teams can inspect how the project works.
  - article:
    - text: Governance
    - heading "Open project model" [level=3]
    - paragraph: Project roles, governance, and decision processes are available for review.
    - link "Governance":
      - /url: /about/governance
  - article:
    - text: Security
    - heading "Published response process" [level=3]
    - paragraph: Security reporting and response expectations are documented for users and vendors.
    - link "Security policy":
      - /url: /about/security-policy
  - article:
    - text: CI
    - heading "Public testing resources" [level=3]
    - paragraph: CI resources and status information are available for contributors and evaluators.
    - link "CI resources":
      - /url: /contribute/ci
  - paragraph: Why Xen matters now
  - heading "Modern platforms still need a strong virtualization layer." [level=2]
  - paragraph: For technical evaluators, Xen is most relevant where isolation, openness, long-term platform work, and security-sensitive engineering matter.
  - article:
    - heading "Isolation as a foundation" [level=3]
    - paragraph: Xen is built around a hypervisor layer that separates guest systems from the underlying platform.
    - link "Explore the hypervisor":
      - /url: /projects/hypervisor
  - article:
    - heading "Open engineering model" [level=3]
    - paragraph: Governance and contribution paths are visible to organizations and individual engineers.
    - link "Read governance":
      - /url: /about/governance
  - article:
    - heading "Security-sensitive platforms" [level=3]
    - paragraph: Security policy, vulnerability reporting, and related project work are part of the evaluation path.
    - link "Review security policy":
      - /url: /about/security-policy
  - paragraph: Where Xen excels
  - heading "Built for engineers working close to the platform." [level=2]
  - paragraph: Xen is strongest when teams need to reason carefully about virtual machines, hardware, operating systems, and trust boundaries.
  - article:
    - heading "Cloud and infrastructure" [level=3]
    - paragraph: Xen projects include the hypervisor and toolstack work used to build virtualization platforms.
    - link "View projects":
      - /url: /projects/all-projects
  - article:
    - heading "Embedded and automotive" [level=3]
    - paragraph: The Embedded & Automotive project describes Xen for systems that need isolation, real-time support, and fault tolerance.
    - link "Explore embedded work":
      - /url: /projects/embedded-and-automotive
  - article:
    - heading "Introspection and security tooling" [level=3]
    - paragraph: HVMI focuses on real-time monitoring and protection for virtualized environments.
    - link "Explore HVMI":
      - /url: /projects/hvmi
  - article:
    - heading "Specialized operating systems" [level=3]
    - paragraph: MirageOS and Unikraft show how Xen ecosystem projects support focused, lightweight systems work.
    - link "See ecosystem projects":
      - /url: /projects/all-projects
  - paragraph: Architecture
  - heading "A clear boundary for platform control." [level=2]
  - paragraph: Xen sits between hardware and guest systems. That position gives platform teams a place to make virtualization, isolation, and control decisions without treating the operating system as the whole boundary.
  - link "Explore the hypervisor":
    - /url: /projects/hypervisor
  - link "Read use cases":
    - /url: /resources/use-cases
  - complementary:
    - heading "A focused virtualization layer" [level=2]
    - paragraph: The hypervisor project page is the best place to start for architecture details, related resources, and project scope.
    - link "Hypervisor details":
      - /url: /projects/hypervisor
  - paragraph: Guests
  - paragraph: Virtualized systems stay above the hypervisor boundary.
  - paragraph: Hardware
  - paragraph: Platform integration stays visible to teams that need control.
  - paragraph: Project areas
  - heading "Explore the Xen project ecosystem." [level=2]
  - paragraph: Key project areas are available through direct links so teams can scan capabilities and go deeper where relevant.
  - article:
    - heading "Embedded & Automotive" [level=3]
    - paragraph: Maturity, isolation, security features, real-time support, fault-tolerance, and a flexible architecture make the Xen Project Hypervisor a perfect match for embedded and automotive systems.
    - link "Open project":
      - /url: /projects/embedded-and-automotive
  - article:
    - heading "HVMI" [level=3]
    - paragraph: Explore Xen Project's Hypervisor Memory Introspection (HVMI). Learn how HVMI enhances security by providing real-time monitoring and protection for virtualized environments.
    - link "Open project":
      - /url: /projects/hvmi
  - article:
    - heading "Hypervisor" [level=3]
    - paragraph: Discover Xen Hypervisor, the open-source virtualization platform.
    - link "Open project":
      - /url: /projects/hypervisor
  - article:
    - heading "Mirage OS" [level=3]
    - paragraph: MirageOS is a library operating system that constructs unikernels for secure, high-performance, low-energy footprint applications.
    - link "Open project":
      - /url: /projects/mirage-os
  - article:
    - heading "XAPI" [level=3]
    - paragraph: The XAPI project is an enterprise-ready toolstack for use with the Xen Project hypervisor.
    - link "Open project":
      - /url: /projects/xapi
  - article:
    - heading "XCP-ng" [level=3]
    - paragraph: XCP-ng (Xen Cloud Platform – new generation) is a turnkey virtualization platform built on the Xen Project Hypervisor and using the Xen API (XAPI). It is typically managed with Xen Orchestra, an agentless, multi-cluster web interface that provides management, monitoring, and backup capabilities.
    - link "Open project":
      - /url: /projects/xcp-ng

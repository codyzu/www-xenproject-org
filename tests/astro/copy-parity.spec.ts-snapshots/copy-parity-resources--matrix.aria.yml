    - heading "Netiquette" [level=3]
    - paragraph: Netiquette encourages individuals to be considerate, kind, and mindful of the impact their words and actions can have on others in the online community.
    - paragraph: It encompasses aspects like using proper language, avoiding offensive content, respecting privacy, and engaging in constructive discussions while maintaining a positive online environment for everyone.
    - paragraph: If you are new and also post on the mailing list, we highly recommend you introduce yourself to the community!
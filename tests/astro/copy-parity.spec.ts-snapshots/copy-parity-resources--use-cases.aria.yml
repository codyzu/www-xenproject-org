- main:
  - paragraph: Solution Area
  - heading "Open virtualization for cloud and infrastructure platforms." [level=1]
  - paragraph: Infrastructure still needs a clear virtualization boundary. Xen provides an open, inspectable hypervisor layer for teams reasoning about guest isolation, hardware ownership, control domains, platform lifecycle, and long-term infrastructure sustainability.
  - link "Explore the hypervisor":
    - /url: /projects/hypervisor
  - link "Explore XCP-ng":
    - /url: /projects/xcp-ng

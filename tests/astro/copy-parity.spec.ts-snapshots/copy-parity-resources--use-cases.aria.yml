  - heading "A Xen-centered ecosystem for infrastructure platforms." [level=2]
  - paragraph: Xen is the open foundation. XAPI is the Xen Project toolstack and management layer for Xen-based platforms. XCP-ng packages Xen and XAPI into a complete open platform, while commercial offerings and services can build on the same foundation.

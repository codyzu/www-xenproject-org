  - paragraph: Infrastructure ownership
  - heading "Modern infrastructure still depends on a well-defined virtualization layer." [level=2]
  - paragraph: Public clouds, private clouds, hosting providers, edge sites, enterprise virtualization estates, and research clusters all need a place where hardware, guests, tenants, and platform operators can be reasoned about separately.
  - article:
    - heading "Multi-tenant infrastructure" [level=3]
    - paragraph: Keep tenant, service, and operator responsibilities visible when many workloads share the same estate.
  - article:
    - heading "Private and public cloud" [level=3]
    - paragraph: Use a virtualization boundary that can be inspected, governed, and sustained independently of one vendor stack.
  - article:
    - heading "Hosting and edge platforms" [level=3]
    - paragraph: Build platforms where lifecycle, hardware, network, and guest ownership choices remain explicit.
  - article:
    - heading "Long-lived estates" [level=3]
    - paragraph: Support research clusters, enterprise virtualization, and infrastructure platforms that evolve over years.
  - paragraph: Why a dedicated hypervisor?
  - heading "A focused layer for isolation, ownership, and platform control." [level=2]
  - paragraph: Xen places the virtualization boundary in a dedicated hypervisor layer, giving infrastructure teams an explicit place to reason about guest isolation, hardware ownership, and platform control without treating one guest operating system as the whole platform.
  - article:
    - heading "A visible boundary" [level=3]
    - paragraph: Xen places virtualization in a dedicated hypervisor layer so infrastructure teams have an explicit place to reason about isolation and control.
  - article:
    - heading "Control domains" [level=3]
    - paragraph: Platform operators can make hardware-facing control and management responsibilities part of the architecture instead of hiding them inside every guest.
  - article:
    - heading "Inspectable architecture" [level=3]
    - paragraph: Source, governance, development process, and project infrastructure are public evaluation inputs for teams building long-lived platforms.
  - paragraph: Technical capabilities
  - heading "Capabilities for infrastructure platforms" [level=2]
  - paragraph: After the virtualization boundary is clear, teams can evaluate Xen and the surrounding platform tooling for hardware ownership, guest lifecycle, and operational control.
  - article:
    - heading "PCI passthrough" [level=3]
    - paragraph: Assign selected devices directly to guests when infrastructure design requires clear hardware ownership.
    - link "Review isolation resources":
      - /url: /technology/isolation-and-security
  - article:
    - heading "SR-IOV" [level=3]
    - paragraph: Support network and I/O designs that expose virtual functions while keeping ownership decisions visible.
    - link "Explore architecture":
      - /url: /technology/architecture
  - article:
    - heading "NUMA awareness" [level=3]
    - paragraph: Evaluate placement and resource locality as part of the platform model for larger hosts.
    - link "Visit project":
      - /url: /projects/hypervisor
  - article:
    - heading "VM migration through platform tooling" [level=3]
    - paragraph: XAPI-based systems document VM migration and pool capabilities for managed infrastructure environments.
    - link "Explore XAPI":
      - /url: /projects/xapi
  - article:
    - heading "Control domains" [level=3]
    - paragraph: Choose how management, device, and platform-control responsibilities are represented in the system.
    - link "Explore architecture":
      - /url: /technology/architecture
  - article:
    - heading "Hardware virtualization support" [level=3]
    - paragraph: Run guest systems on hardware virtualization features while keeping the hypervisor boundary explicit.
    - link "Explore the hypervisor":
      - /url: /projects/hypervisor
  - article:
    - heading "Flexible scheduling" [level=3]
    - paragraph: Treat CPU allocation and scheduling policy as infrastructure design concerns.
    - link "Explore architecture":
      - /url: /technology/architecture
  - article:
    - heading "Guest isolation" [level=3]
    - paragraph: Separate guests from each other and from hardware-facing responsibilities through the virtualization layer.
    - link "Review isolation resources":
      - /url: /technology/isolation-and-security
  - article:
    - heading "Scalable VM management" [level=3]
    - paragraph: Use XAPI and XCP-ng when teams need management APIs, host pools, and VM lifecycle operations above Xen.
    - link "Explore XCP-ng":
      - /url: /projects/xcp-ng
  - paragraph: Where Xen fits
  - heading "A virtualization foundation for operators and platform builders." [level=2]
  - paragraph: Xen is relevant when teams need to own the boundary between guests, infrastructure hardware, and management responsibilities across different deployment models.

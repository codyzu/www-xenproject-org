  - paragraph: Why architects choose Xen
  - heading "Evaluation starts with ownership, openness, and maintainability." [level=2]
  - paragraph: Infrastructure teams evaluating a virtualization foundation need more than a feature checklist. They need a project model they can inspect, sustain, and build around.
  - article:
    - heading "Infrastructure ownership" [level=3]
    - paragraph: Operators can evaluate the boundary between guest systems, management domains, and owned hardware.
  - article:
    - heading "Open governance" [level=3]
    - paragraph: Project governance and contribution paths are public, giving organizations a visible project model.
    - link "Read governance":
      - /url: /about/governance
  - article:
    - heading "Inspectable source" [level=3]
    - paragraph: Infrastructure teams can review source, releases, and public engineering activity as part of evaluation.
    - link "View downloads":
      - /url: /resources/downloads
  - article:
    - heading "Security response process" [level=3]
    - paragraph: Security reporting and response expectations are documented for users, vendors, and contributors.
    - link "Review security policy":
      - /url: /about/security-policy
  - article:
    - heading "Long-lived maintainability" [level=3]
    - paragraph: An open project model helps teams plan platforms that must be reviewed and updated over long lifecycles.
  - article:
    - heading "Member-funded ecosystem" [level=3]
    - paragraph: Project membership helps sustain shared infrastructure, events, trademark stewardship, and coordination.
    - link "Become a member":
      - /url: /about/become-a-member

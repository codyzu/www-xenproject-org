  - paragraph: Infrastructure ownership
  - heading "Modern infrastructure still depends on a well-defined virtualization layer." [level=2]
  - paragraph: Public clouds, private clouds, hosting providers, edge sites, enterprise estates, and research clusters all need a place where hardware, guests, tenants, and operators can be reasoned about separately.
  - article:
    - heading "Multi-tenant infrastructure" [level=3]
    - paragraph: Keep tenant, service, and operator responsibilities visible on shared estates.
  - article:
    - heading "Private and public cloud" [level=3]
    - paragraph: Choose a foundation teams can inspect, govern, and sustain in the open.
  - article:
    - heading "Hosting and edge platforms" [level=3]
    - paragraph: Keep lifecycle, hardware, network, and guest ownership choices explicit.
  - article:
    - heading "Long-lived estates" [level=3]
    - paragraph: Evaluate a foundation for platforms that evolve over years.
  - paragraph: Why a dedicated hypervisor?
  - heading "A focused layer for isolation, ownership, and platform control." [level=2]
  - paragraph: Xen gives operators a hypervisor layer for guest isolation, hardware ownership, and platform control without treating one guest operating system as the whole platform.
  - article:
    - heading "A visible boundary" [level=3]
    - paragraph: Xen gives operators an explicit place to reason about isolation and control.
  - article:
    - heading "Control domains" [level=3]
    - paragraph: Hardware-facing control and management responsibilities stay part of the platform architecture.
  - article:
    - heading "Inspectable architecture" [level=3]
    - paragraph: Source, governance, development process, and project infrastructure are public evaluation inputs.
  - article:
    - paragraph: Xen in the datacenter
    - heading "Infrastructure demand is feeding upstream Xen." [level=2]
    - paragraph: At Xen Summit 2025, Olivier Lambert of Vates explained how shifts in the virtualization market are driving new adoption of Xen-based infrastructure and creating more resources for upstream Xen development.
    - paragraph: Olivier Lambert, Vates
    - paragraph: Xen Summit 2025
    - paragraph: "Xen & XCP-ng in the Datacenter: State of the Union"
    - link "Watch the full talk":
      - /url: https://www.youtube.com/watch?v=1K8fs6nq78Q
    - 'button "Play 1:04 clip: Infrastructure demand is feeding upstream Xen."': Play clip

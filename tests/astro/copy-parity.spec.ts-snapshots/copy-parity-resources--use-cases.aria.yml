- main:
  - paragraph: Solution Area
  - heading "Open virtualization for cloud and infrastructure platforms." [level=1]
  - paragraph: Open infrastructure starts with an open virtualization layer. Xen gives operators an inspectable hypervisor for guest isolation, hardware ownership, control domains, and long-term platform sustainability.

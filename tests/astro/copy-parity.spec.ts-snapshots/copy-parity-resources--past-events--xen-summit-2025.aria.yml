    - heading "Design Sessions 🛠️" [level=2]
    - paragraph:
      - text: Design sessions are a crucial part of community engagement at Xen Project events. Xen Summit 2025 hosted design sessions on
      - strong: Tuesday September 16
      - text: and
      - strong: Wednesday September 17
      - text: .
    - paragraph:
      - link "Browse the design session portal for notes and updates.":
        - /url: https://design-sessions.xenproject.org/
    - heading "Suggested Topics for Design and Problem Solving Sessions" [level=3]
    - paragraph: "The aim of the Design and Problem Solving sessions are to give developers the opportunity to meet face-to-face to:"
    - list:
      - listitem: Coordinate and plan upcoming features
      - listitem: Discuss and agree on best practices and changes to how the community works
      - listitem: Discuss and agree on the design and architecture of future functionality
      - listitem: Interactive lessons learned sessions covering experiences of contributors, users and vendors
    - paragraph: "Examples of Design and Problem Solving Sessions from past Hackathons were:"
    - list:
      - listitem: Cadence of Xen Project and maintenance releases
      - listitem: Changes to the COLO architecture and interdependencies with migration v2
      - listitem: Developing the architecture and design for Xen Project live patching of new Xen Project security policy
      - listitem: Evolution of virtual machine introspection (including HW assistance) in the Xen Hypervisor
      - listitem: How to de-privileging QEMU and the x86 emulator to reduce the impact of security vulnerabilities in those components
      - listitem: Implementing KConfig support which allows to remove parts of Xen at compile time and run-time disablement of Xen features to reduce Xen’s trusted computing base.
      - listitem: Planning the next stage of PVH (which led to a re-think and PVH v2)
      - listitem: Planning sessions for Xen Hardware support, including PCI passthrough on ARM, broader ARM HW testing, and alt2pm on Intel architectures
      - listitem: Release planning
      - listitem: Restartable Dom0 and driver domains
      - listitem: Testing and testing frameworks
    - heading "Design Session Submission Tips" [level=3]
    - paragraph: "If you are proposing a design and planning session, please clearly state:"
    - list:
      - listitem: The problem that you are trying to solve
      - listitem: How attendees of the session can contribute to solving your problem
      - listitem: Whether any preparation work is desirable, including links to existing material
    - paragraph: The proposer of design and planning sessions is expected to moderate sessions, which are held in smaller breakout rooms equipped with whiteboards. Some rooms will also contain projectors. Moderators can give a short presentation to introduce the problem, but design and planning sessions are not presentations. As a guide, presentations should not exceed more than 25% of the overall session time. Sessions will not be recorded, but we expect that the moderator either takes minutes or nominates an attendee to do so. Minutes will be posted on the relevant mailing list. Design and planning sessions scale well to a maximum of 30 people.
    - heading "First Time Submitting? Don’t Feel Intimidated." [level=3]
    - paragraph: We know that the open source community can be very intimidating for anybody who is interested in participating.
    - paragraph: Xen Project events are an excellent way to get to know the community and share your ideas and the work that you are doing. You do not need to be a maintainer or a chief architect to submit a proposal. In fact, we strongly encourage first-time speakers to submit talks for all of our events. If you aren’t sure about your abstract, reach out to us and we will be more than happy to work with you on your proposal.
    - paragraph: Our events are working conferences intended for professional networking and collaboration in the Xen community. We work closely with attendees, sponsors, and speakers to keep Xen Project events professional, welcoming, and friendly. If you have any questions about participating, please don’t hesitate to contact us.

    - heading "Unikraft" [level=3]
    - heading "MINIOS-DEVEL@ (INCLUDES UNIKRAFT DEVELOPMENT)" [level=2]
    - text: Mailing list A discussion list for MiniOS and Unikraft development.
    - link "Info ":
      - /url: https://lists.xenproject.org/cgi-bin/mailman/listinfo/minios-devel
    - link "Archives about MINIOS-DEVEL@ (INCLUDES UNIKRAFT DEVELOPMENT)":
      - /url: https://lists.xenproject.org/archives/html/minios-devel
      - text: Archives 
    - heading "XAPI" [level=3]
    - heading "XEN-API@" [level=2]
    - text: Mailing list A discussion list for the XAPI project, developing an open-source management layer for Xen-based systems. The list is both for developers and users.
    - link "Info ":
      - /url: https://lists.xenproject.org/cgi-bin/mailman/listinfo/xen-api
    - link "Archives about XEN-API@":
      - /url: https://lists.xenproject.org/archives/html/xen-api
      - text: Archives 
    - heading "XCP-ng" [level=3]
    - heading "XCP-NG FORUMS" [level=2]
    - text: Forum Announcements related to the project. These may be release announcements, security advisories, announcements related to events. This is a low volume list, with about 1-2 posts per month.
    - link "All forums ":
      - /url: https://xcp-ng.org/forum/
    - link "Development about XCP-NG FORUMS":
      - /url: https://xcp-ng.org/forum/category/7/development
      - text: Development 
    - heading "XCP-NG NEWSLETTER" [level=2]
    - text: Newsletter This list is for those using and installing the Xen Project software.
    - link "Subscribe ":
      - /url: http://eepurl.com/gtO5-H
    - heading "XCP-ng-dev" [level=2]
    - text: Forum For developer specific questions and those who want to contribute, this channel is for you, based on XCP-ng forum.
    - link "Info ":
      - /url: https://xcp-ng.org/forum/category/19/xcp-ng
    - heading "Windows PV Drivers" [level=3]
    - heading "WIN-PV-DEVEL@" [level=2]
    - text: Mailing list A discussion list for the Windows PV Drivers developer community.
    - link "Info ":
      - /url: https://lists.xenproject.org/cgi-bin/mailman/listinfo/win-pv-devel
    - link "Archives about WIN-PV-DEVEL@":
      - /url: https://lists.xenproject.org/archives/html/win-pv-devel
      - text: Archives 
    - heading "Advisory board" [level=2]
    - heading "ADVISORY-BOARD@" [level=2]
    - text: Mailing list A discussion list for members of the Xen Project Advisory Board. The list is invite-only.
    - link "Info ":
      - /url: http://wiki.xenproject.org/wiki/Category:Advisory_Board
    - heading "Predisclosure" [level=2]
    - heading "PREDISCLOSURE-APPLICATIONS@" [level=2]
    - text: Mailing list Organizations who want to become a member of the Xen Project predisclosure list to receive pre-disclosure of security advisories and who meet the criteria outlined in the Xen Security Problem Response Process should become members of this mailing list and submit their application through this mailing list as outlined in Xen Security Problem Response Process. The list is open to all community members who care about security and although pre-disclosure membership applications are evaluated based on strict criteria, all applications are open for review and comment by community members. The list is also archived.
    - link "Info ":
      - /url: https://lists.xenproject.org/cgi-bin/mailman/listinfo/predisclosure-applications
    - link "Archives about PREDISCLOSURE-APPLICATIONS@":
      - /url: https://lists.xenproject.org/archives/html/predisclosure-applications
      - text: Archives 
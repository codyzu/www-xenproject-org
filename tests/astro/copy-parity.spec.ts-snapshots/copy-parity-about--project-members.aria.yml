  - paragraph: What support enables
  - heading "Member support keeps shared responsibilities visible and funded." [level=2]
  - article:
    - heading "Shared project infrastructure" [level=3]
    - paragraph: Membership helps fund hosting, test environments, and operational resources used across the project.
  - article:
    - heading "Events and coordination" [level=3]
    - paragraph: Members support project events, communications, and collaboration across organizational boundaries.
  - article:
    - heading "Trademark stewardship" [level=3]
    - paragraph: The Advisory Board manages the Xen Project trademark and related non-technical responsibilities.
  - article:
    - heading "Long-term project health" [level=3]
    - paragraph: Sustained organizational participation supports shared programs and a neutral, open ecosystem.
  - paragraph: Open governance
  - heading "Member support and technical contribution are distinct." [level=2]
  - paragraph: The Advisory Board manages funding, events, communications, and trademark responsibilities. Technical decisions remain with the project’s open source meritocracy, where responsibility is earned through public contribution and peer review.
  - link "Read the governance model":
    - /url: /about/governance
  - complementary:
    - heading "Membership supports the project; it does not buy code authority" [level=3]
    - paragraph: Organizations do not need to be members to contribute technically, and membership does not override maintainer review or public project processes.
  - paragraph: Organizational participation
  - heading "Add your organization to the project’s support network." [level=2]
  - paragraph: Review what membership enables and continue to the Linux Foundation-managed enrollment process when your organization is ready.
  - link "Explore Xen Project membership":
    - /url: /about/become-a-member
  - link "Read project governance":
    - /url: /about/governance
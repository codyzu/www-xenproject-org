    - heading "Introduction to Xen Research" [level=2]
    - paragraph: The Xen Project has been instrumental in advancing virtualization technology. This page highlights key academic research papers that delve into the architecture, performance, and security of the Xen hypervisor, showcasing its impact on both industry and academia.
    - text: "Search Papers:"
    - searchbox "Search Papers:"
    - table:
      - rowgroup:
        - row:
          - cell:
            - 'link "FastXenBlk: high-performance virtualized disk IOs without compromising isolation (industry track)"':
              - /url: /research/thenot2023fastxenblk
            - text: Optimizing IO in a type I hypervisor such as Xen is difficult because of the cost of exchanging data between a VM and the driver. We address this challenge by proposing FastXenBlk, a new IO driver for Xen. FastXenBlk uses three mechanisms to improve IO performance. First, it uses several threads that poll multiple virtual IO queues that are exposed to a guest in order to execute IOs in parallel. Second, it batches requests in order to minimize the number of hypercalls to Xen. And third, it uses kernel bypass in order to avoid system calls during IOs. We evaluate FastXenBlk using the FIO benchmark with different access patterns and IO sizes. Our evaluation shows that FastXenBlk consistently improves the latency and the throughput for all workloads as compared to tapdisk, the driver currently used in production, by a factor of up to 3×.

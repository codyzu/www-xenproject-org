    - heading "Why attend?" [level=2]
    - paragraph: Xen Summit is the best place to connect directly with the people building, using, and deploying Xen across the ecosystem.
    - list:
      - listitem: Learn about the latest Xen developments across cloud, embedded, automotive, security, and datacenter use cases
      - listitem: Meet maintainers, contributors, users, vendors, and ecosystem partners
      - listitem: Take part in design discussions that shape future Xen development
      - listitem: Share deployment experiences, lessons learned, and technical challenges with the community

    - heading "Registration status" [level=3]
    - paragraph: Registration is not open yet.
    - paragraph: Pricing is available now so attendees, organizations, and sponsors can plan ahead before registration opens.
    - paragraph: Early Bird pricing runs until June 30, 2026.
    - heading "Travel" [level=3]
    - paragraph: Munich is well connected by air, rail, and public transit. The HEADS office is in Aschheim, east of central Munich, at Einsteinring 30, 85609 Aschheim, Germany.
    - list:
      - listitem:
        - strong: "Venue map:"
        - link "HEADS office on Google Maps":
          - /url: https://maps.app.goo.gl/4h4E7zzcBjJuiecK9
      - listitem:
        - strong: "Airport:"
        - link "Munich Airport (MUC)":
          - /url: https://www.munich-airport.com/
        - text: is the closest major international airport.
      - listitem:
        - strong: "Rail:"
        - text: Munich Hauptbahnhof is the main long-distance rail station for arrivals from Germany and across Europe.
      - listitem:
        - strong: "Public transit:"
        - text: Use
        - link "MVV Munich public transit":
          - /url: https://www.mvv-muenchen.de/en/
        - text: to plan S-Bahn, U-Bahn, tram, and bus connections toward Aschheim.
      - listitem:
        - strong: "Taxi and rideshare:"
        - text: Taxis are available at the airport, major rail stations, and throughout Munich. Rideshare availability may vary by provider and pickup location.
    - heading "Lodging" [level=4]
    - paragraph: There is no official hotel block yet. Attendees may want to stay either near the venue in Aschheim for a shorter local commute, or in central Munich with convenient transit access to the eastern side of the city.
    - heading "Call for Proposals" [level=3]
    - paragraph:
      - text: The Call for Proposals is open.
      - link "Submit your talk":
        - /url: https://sessionize.com/XenSummit2026/
      - text: by
      - strong: June 30, 2026
      - text: at 11:59 PM W. Europe Daylight Time to share your work with the Xen Project community in Munich or online.
    - paragraph: New speakers are welcome.
    - paragraph: "We welcome proposals from across the Xen ecosystem, including:"
    - list:
      - listitem: Xen development and architecture
      - listitem: Embedded and automotive virtualization
      - listitem: Security, isolation, and safety-related use cases
      - listitem: Safety and certification-related work
      - listitem: Performance, scalability, and reliability
      - listitem: Cloud, datacenter, and infrastructure deployments
      - listitem: Tooling, testing, CI, and developer experience
      - listitem: Open source collaboration and community process
      - listitem: Xen on Arm and other platform work
      - listitem: Real-world deployments, case studies, and lessons learned

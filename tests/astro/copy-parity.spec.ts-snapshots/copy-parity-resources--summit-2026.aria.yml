    - heading "Registration" [level=3]
    - paragraph: Registration is open. Early Bird pricing has ended, and standard pricing is now in effect.
    - paragraph:
      - link "Register now ":
        - /url: https://register.linuxfoundation.org/xen-summit-2026
    - heading "Travel" [level=3]
    - paragraph: Munich is well connected by air, rail, and public transit. The HEADS office is in Aschheim, east of central Munich, at Einsteinring 30, 85609 Aschheim, Germany.
    - list:
      - listitem:
        - strong: "Venue map:"
        - link "HEADS office on Google Maps":
          - /url: https://maps.app.goo.gl/4h4E7zzcBjJuiecK9
      - listitem:
        - strong: "Airport:"
        - link "Munich Airport (MUC)":
          - /url: https://www.munich-airport.com/
        - text: is the closest major international airport.
      - listitem:
        - strong: "Rail:"
        - text: Munich Hauptbahnhof is the main long-distance rail station for arrivals from Germany and across Europe.
      - listitem:
        - strong: "Public transit:"
        - text: Use
        - link "MVV Munich public transit":
          - /url: https://www.mvv-muenchen.de/en/
        - text: to plan S-Bahn, U-Bahn, tram, and bus connections toward Aschheim.
      - listitem:
        - strong: "Taxi and rideshare:"
        - text: Taxis are available at the airport, major rail stations, and throughout Munich. Rideshare availability may vary by provider and pickup location.

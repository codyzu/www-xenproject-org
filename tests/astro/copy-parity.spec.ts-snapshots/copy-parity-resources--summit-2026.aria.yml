    - heading "Hosted by Renesas" [level=4]
    - paragraph: Xen Summit 2026 is proudly hosted by Renesas in Munich, Germany. The event will take place at the HEADS office in Aschheim, located directly across from the Renesas Munich office.
    - link "Renesas logo":

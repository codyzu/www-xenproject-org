    - heading "Design day" [level=2]
    - paragraph: September 17 was dedicated to design sessions, project planning, and collaboration. These working discussions gave contributors and users time to work through project direction, architecture, implementation plans, and community process face to face.
    - paragraph: "Design sessions are a central part of Xen Summit: a space to coordinate future features, share experience, and work through technical questions together."

    - heading "Community Social" [level=2]
    - paragraph: /A Xen Summit community social event is planned for the evening of September \d+\. Additional details will be announced soon\./
    - heading "Design Sessions" [level=2]
    - paragraph: Design sessions are a central part of Xen Summit. They give contributors and users time to work through project direction, architecture, implementation plans, and community process face to face.
    - paragraph: /Design sessions are expected to take place on the third day of the summit\. The \d+ design-session schedule and details will be announced closer to the event\./
    - heading "Suggested Topics for Design and Problem Solving Sessions" [level=3]
    - paragraph: "Design and problem-solving sessions are intended to help developers:"
    - list:
      - listitem: Coordinate and plan upcoming features
      - listitem: Discuss best practices and changes to how the community works
      - listitem: Agree on the design and architecture of future functionality
      - listitem: Share lessons learned from contributors, users, and vendors
    - paragraph: Design sessions are working sessions, not standard presentations. Moderators may introduce the topic briefly, but most of the time should be reserved for discussion, planning, and decisions.

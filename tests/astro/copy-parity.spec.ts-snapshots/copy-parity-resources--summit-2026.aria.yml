    - heading "Talks and program" [level=2]
    - paragraph: The September 15–16 program covered Xen development, embedded and automotive virtualization, safety, security, cloud infrastructure, Arm platforms, tooling, testing, and real-world deployments.
    - heading "Watch the recordings" [level=3]
    - paragraph: Catch up on the technical talks and revisit discussions from across the Xen ecosystem.

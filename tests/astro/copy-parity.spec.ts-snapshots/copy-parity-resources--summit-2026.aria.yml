    - paragraph: Xen Summit 2026 brought together developers, maintainers, users, researchers, and organizations from across the Xen ecosystem for three days of talks, technical discussion, design sessions, and community collaboration.
    - paragraph: "Hosted by Renesas at the HEAS office in Aschheim, near Munich, the Summit took place on September 15–17, 2026: two days of talks followed by a design day. Thank you to everyone who contributed, spoke, and participated."

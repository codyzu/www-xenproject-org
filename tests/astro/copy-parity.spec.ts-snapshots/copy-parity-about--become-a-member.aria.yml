- main:
  - paragraph: Organizational membership
  - heading "Support the shared foundation behind Xen." [level=1]
  - paragraph: Membership sustains project stewardship and coordination. Technical authority continues to be earned through open contribution.
  - paragraph: Understand how your organization can support the Xen Project, then continue to the Linux Foundation-managed membership process.
  - link "Continue to the LF membership form":
    - /url: https://enrollment.lfx.linuxfoundation.org/?project=xen
  - link "View current members":
    - /url: /about/project-members
  - paragraph: How support flows
  - list:
    - listitem:
      - text: Organizations provide sustained support
      - paragraph: Membership funds and coordinates shared project needs.
    - listitem:
      - text: The Advisory Board stewards non-technical work
      - paragraph: Budgets, infrastructure, events, and trademarks remain visible responsibilities.
    - listitem:
      - text: Technical decisions stay with the open project
      - paragraph: Maintainers and committers review code through the project’s meritocratic process.
  - paragraph: Why organizations join
  - heading "Support the work that keeps an open project healthy." [level=2]
  - paragraph: Membership is an organizational participation path for the shared responsibilities around Xen. It complements—not replaces—technical contribution.
  - article:
    - heading "Sustain shared infrastructure" [level=3]
    - paragraph: Membership dues support project operations, hosting, test environments, and other shared resources.
  - article:
    - heading "Coordinate across organizations" [level=3]
    - paragraph: The Advisory Board gives organizational stakeholders a forum for project funding, events, communications, and ecosystem coordination.
  - article:
    - heading "Support project stewardship" [level=3]
    - paragraph: Members help oversee non-technical responsibilities such as budgets, trademarks, and project-wide programs.
  - article:
    - heading "Strengthen an open ecosystem" [level=3]
    - paragraph: Member support helps maintain a neutral project environment for infrastructure, embedded, automotive, and security-sensitive work.
  - paragraph: Clear responsibilities
  - heading "Membership and technical contribution are distinct." [level=2]
  - paragraph: The Xen Project Advisory Board manages non-technical matters including funding for shared infrastructure, marketing and events, and the Xen Project trademark. Technical decisions remain with the open source meritocracy and the maintainers responsible for each project area.
  - link "Read project governance":
    - /url: /about/governance
  - link "Start contributing":
    - /url: /contribute/get-started
  - paragraph: Two participation paths
  - text: Organizational support
  - paragraph: Membership, project stewardship, funding, and coordination.
  - text: Technical contribution
  - paragraph: Open review, demonstrated contribution, and merit-based responsibility.
  - complementary:
    - heading "Membership does not purchase technical authority" [level=3]
    - paragraph: Organizations and engineers can contribute without becoming members, and membership does not bypass the project’s public technical process.
  - paragraph: Membership options
  - heading "Find the appropriate organizational path." [level=2]
  - paragraph: The current program lists the options below. Pricing and final eligibility are not maintained on this page; the Linux Foundation enrollment process provides the current details.
  - article:
    - heading "Premier Member" [level=3]
    - paragraph: A current option listed by the Xen Project membership program. The Linux Foundation confirms current terms through the enrollment process.
  - article:
    - heading "Advisory Board Governing Member" [level=3]
    - paragraph: For organizations participating in the Advisory Board’s non-technical governance and project stewardship responsibilities.
  - article:
    - heading "Startup Member" [level=3]
    - paragraph: For organizations with fewer than 100 employees, subject to approval under the current membership requirements.
  - article:
    - heading "Associate Member" [level=3]
    - paragraph: For eligible, pre-approved Linux Foundation associate organizations, including qualifying government or academic institutions.

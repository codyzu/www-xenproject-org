  - paragraph: Safety-oriented work
  - heading "Support collaboration where evidence matters." [level=2]
  - paragraph: Xen Project participants collaborate on engineering practices, documentation, tooling, and evidence for safety-conscious and certification-oriented systems.
  - link "Review safety-oriented work":
    - /url: /technology/safety
  - complementary:
    - text: Important
    - heading "Certification depends on the complete system" [level=3]
    - paragraph: Xen source code is not itself safety certified. Certification depends on integration context, process, evidence, tooling, validation, and the complete system safety case.
  - paragraph: Next step
  - heading "Ready to discuss Xen Project membership?" [level=2]
  - paragraph: Continue to the enrollment form, or contact the Xen Project team for membership context.
  - paragraph: XenProject.org does not host or manage the form. The Linux Foundation handles validation, submission, membership workflow, and confirmation.

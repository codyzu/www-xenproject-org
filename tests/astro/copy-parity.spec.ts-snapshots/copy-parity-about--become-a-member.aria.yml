  - paragraph: Safety-oriented work
  - heading "Support collaboration where evidence matters." [level=2]
  - paragraph: Xen Project participants collaborate on engineering practices, documentation, tooling, and supporting artifacts for safety-conscious and certification-oriented systems. Membership can help sustain that shared work, while technical participation follows the project’s open processes.
  - link "Review safety-oriented work":
    - /url: /technology/safety
  - complementary:
    - text: Important
    - heading "Certification depends on the complete system" [level=3]
    - paragraph: Xen source code is not itself safety certified. Certification depends on integration context, process, evidence, tooling, validation, and the complete system safety case.
  - paragraph: Linux Foundation handoff
  - heading "Continue with the organization that manages enrollment." [level=2]
  - paragraph: The next step leaves XenProject.org and opens the Linux Foundation’s LFX enrollment service. The Linux Foundation manages the form, validation, submission, membership workflow, and confirmation experience.
  - text: What happens next
  - paragraph: Use the LFX form to begin the Xen Project membership process. The existing project parameter is preserved in the destination URL.
  - link "Continue to the LF membership form":
    - /url: https://enrollment.lfx.linuxfoundation.org/?project=xen
  - paragraph:
    - text: Need project context before continuing? Email
    - link "community.manager@xenproject.org":
      - /url: mailto:community.manager@xenproject.org
    - text: .
  - paragraph: Next step
  - heading "Ready to discuss organizational membership?" [level=2]
  - paragraph: Continue to the Linux Foundation-managed form or contact the Xen Project team if you need help choosing the appropriate path.

  - paragraph: How support flows
  - list:
    - listitem:
      - text: Members sustain shared project needs
      - paragraph: Support funds infrastructure and operations.
    - listitem:
      - text: The Advisory Board coordinates stewardship
      - paragraph: It manages non-technical project responsibilities.
    - listitem:
      - text: Maintainers govern technical decisions
      - paragraph: Responsibility is earned through open contribution.
  - paragraph: Why organizations join
  - heading "Support the work that keeps an open project healthy." [level=2]
  - paragraph: Organizational membership supports the shared responsibilities around Xen.
  - article:
    - heading "Sustain shared infrastructure" [level=3]
    - paragraph: Support project operations, hosting, test environments, and shared resources.
  - article:
    - heading "Coordinate across organizations" [level=3]
    - paragraph: Give organizational stakeholders a forum for funding, events, communications, and ecosystem coordination.
  - article:
    - heading "Support project stewardship" [level=3]
    - paragraph: Help steward budgets, trademarks, and project-wide programs.
  - article:
    - heading "Strengthen an open ecosystem" [level=3]
    - paragraph: Maintain a neutral home for infrastructure, embedded, automotive, and security-sensitive work.
  - paragraph: Clear responsibilities
  - heading "Membership and technical contribution are distinct." [level=2]
  - paragraph: The Advisory Board manages non-technical matters including shared infrastructure funding, events, communications, and the Xen Project trademark. Technical decisions remain with maintainers through the open project meritocracy.
  - link "Read project governance":
    - /url: /about/governance
  - link "Start contributing":
    - /url: /contribute/get-started
  - paragraph: Two participation paths
  - text: Organizational support
  - paragraph: Stewardship, funding, and coordination.
  - text: Technical contribution
  - paragraph: Open review and merit-based responsibility.
  - complementary:
    - heading "Membership does not purchase technical authority" [level=3]
  - paragraph: Membership options
  - heading "Find the appropriate organizational path." [level=2]
  - paragraph: Review the available paths below. The Linux Foundation enrollment process confirms current terms, pricing, and eligibility.
  - article:
    - paragraph: Premier Plus membership
    - heading "Support Xen’s safety-oriented work at the highest membership level." [level=3]
    - paragraph: Premier Plus is Xen’s highest organizational membership level. It helps sustain safety-oriented and certification-focused collaboration across shared evidence, tooling, documentation, engineering practices, and coordination. Technical decisions continue through Xen’s open project processes.
    - paragraph: The Linux Foundation confirms current terms and eligibility through enrollment.
  - article:
    - heading "Premier Member" [level=3]
    - paragraph: A current option listed by the Xen Project membership program. The Linux Foundation confirms current terms through the enrollment process.
  - article:
    - heading "Advisory Board Governing Member" [level=3]
    - paragraph: For organizations participating in the Advisory Board’s non-technical governance and project stewardship responsibilities.
  - article:
    - heading "Startup Member" [level=3]
    - paragraph: /For organizations with fewer than \d+ employees, subject to approval under the current membership requirements\./
  - article:
    - heading "Associate Member" [level=3]
    - paragraph: For eligible, pre-approved Linux Foundation associate organizations, including qualifying government or academic institutions.

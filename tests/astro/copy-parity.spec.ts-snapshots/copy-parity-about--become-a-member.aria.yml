- main:
  - article:
    - heading "Become a member" [level=1]
    - text: Join the Xen community and become a member to actively contribute to the advancement of open-source virtualization.
    - heading "The Xen Project members are companies that are committed to the market and technical success of the Xen Project" [level=2]
    - paragraph: The Xen Project members are companies that are committed to the market and technical success of the Xen Project.
    - paragraph: The Members are complementary to the role of committers and maintainers, with both working closely together to ensure the overall priorities of the project are aligned.
    - paragraph: Committers and maintainers are responsible for the technical development and are the final decision makers on code contributions to the Xen Project.
    - paragraph:
      - link "Join now ":
        - /url: https://enrollment.lfx.linuxfoundation.org/?project=xen
    - img "Illustration of three people having a discussion with speech bubbles, symbolizing teamwork and communication."
    - heading "Main responsibilities" [level=2]
    - list:
      - listitem:
        - heading " Financial oversight" [level=2]
        - paragraph: Budget management and investment decisions on infrastructure and project operations.
      - listitem:
        - heading " Annual pricing" [level=2]
        - paragraph:
          - strong: "Premier Member:"
          - text: $40,000
          - strong: "Advisory Board Governing Member:"
          - text: $30,000
          - strong: "Startup Member*:"
          - text: $10,000
          - strong: "Associate Member**:"
          - text: Free
          - emphasis: "* Startup members must have less than 100 employees and require approval from Governing Board Members."
          - emphasis: "** Associate Members are free and available to pre-approved Associate Members of The Linux Foundation e.g. Government or Academic institutions"
      - listitem:
        - heading " Steer the project" [level=2]
        - paragraph: To advance its market and technical success by raising awareness.
      - listitem:
        - heading " Global policy decisions" [level=2]
        - paragraph: Trademarks, compliance requirements, test cases, and infrastructure.
    - heading "Improve engineering ROI" [level=2]
    - paragraph: The Xen Project is in the process of creating a new common test infrastructure. New test cases for specific hardware and software combinations will lead to higher quality project releases. In addition, a planned focus on a security and hardening framework will enhance the release readiness of the Xen Project.
    - paragraph: The Advisory Board helps define test cases and prioritize release requirements, in cooperation with project maintainers, ultimately increasing engineering ROI from the impact of these decisions.
    - img "Illustration of a person analyzing data, symbolizing data analysis and decision-making."
    - heading "Xen Project Insights" [level=2]
    - paragraph: Board members can propose and vote upon changes to the Xen Project test and validation infrastructure and financial resource allocation.
    - paragraph: By being an active Advisory Board participant, regular opportunities for discussions with technical leaders include the chance to share priorities and endorse new strategies. In return, members will gain valuable strategic insight into project plans and future scope.
    - img "Illustration of a person interacting with charts and graphs on a tablet, representing data visualization and analysis."
    - heading "Increase visibility" [level=2]
    - paragraph: Board members can influence the marketing strategy and participate in a wide range of activities including press releases, brand visibility on the website, and giveaways at events.
    - img "Illustration of two people shaking hands, symbolizing partnership and agreement."
    - heading "Define policies" [level=2]
    - paragraph: Members help define policies, including trademark usage, compliance and certification of Xen derivatives. In addition, membership dues funds project infrastructure, such as hosting and test environments which are essential to the project.
    - paragraph: The Board process will help ensure non-technical decisions are collectively determined. As such, the Advisory Board contributes a sustainable, self-directed source of funding for work that will help drive the marketplace and technical success of the Xen Project.
    - img "Illustration of a light bulb with a brain inside and speech bubbles around it, symbolizing innovation and creative thinking."
    - heading "How to join?" [level=2]:
      - text: How to
      - strong: join?
    - heading "Step 1" [level=3]
    - text: Review membership benefits and requirements on the Xen Project website.
    - heading "Step 2" [level=3]
    - text: Contact the Xen Project team to discuss membership options and fees.
    - heading "Step 3" [level=3]
    - text: Complete the membership application and submit payment to join.
    - paragraph:
      - link "Join now ":
        - /url: https://enrollment.lfx.linuxfoundation.org/?project=xen
    - paragraph:
      - text: Need some help?
      - link "Email us here":
        - /url: mailto:community.manager@xenproject.org
        - strong: Email us here
    - heading "Governed by Xen project members" [level=2]
    - paragraph: Board members can propose and vote upon changes to the Xen Project. Members also gain valuable strategic insight into project plans and future scope.
    - paragraph:
      - link "Meet the advisory board ":
        - /url: /about/project-members

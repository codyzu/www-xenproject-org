- main:
  - paragraph: Organizational membership
  - heading "Support the shared foundation behind Xen." [level=1]
  - paragraph: Support the shared infrastructure, stewardship, and collaboration that keep Xen strong across industries.
  - paragraph: Membership sustains shared project needs. Technical authority remains earned through open contribution.
  - link "Continue to the LF membership form":

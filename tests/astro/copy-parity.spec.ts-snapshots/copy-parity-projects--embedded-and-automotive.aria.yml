  - paragraph: Why virtualization matters here
  - heading "Consolidate the platform without blurring the boundaries." [level=2]
  - paragraph: Embedded and automotive teams are asked to combine more software on shared compute while preserving the boundaries that make engineering, validation, and maintenance practical.
  - article:
    - heading "Shared hardware" [level=3]
    - paragraph: Run more platform software on fewer boards while keeping ownership and failure domains visible.
  - article:
    - heading "Mixed workloads" [level=3]
    - paragraph: Give Linux, RTOS workloads, service domains, and specialized systems a clearer place to coexist.
  - article:
    - heading "Explicit boundaries" [level=3]
    - paragraph: Keep devices, boot flow, interrupts, and integration responsibilities visible to platform teams.
  - article:
    - heading "Maintainable platforms" [level=3]
    - paragraph: Support architectures that can evolve across long hardware, software, and product lifecycles.
  - paragraph: Mixed-criticality systems
  - heading "Why mixed-criticality matters" [level=2]
  - paragraph: Modern embedded and automotive platforms increasingly combine workloads with different safety, timing, reliability, and maintenance requirements on shared compute. The term mixed-criticality is useful because it keeps attention on the engineering boundaries between those workloads, not just the fact that they run on the same hardware.
  - article:
    - heading "Different operating profiles" [level=3]
    - paragraph: Safety-conscious control workloads, RTOS workloads, Linux services, infotainment, telemetry, diagnostics, and OTA services can have different timing, reliability, update, and validation needs.
  - article:
    - heading "Shared compute pressure" [level=3]
    - paragraph: As platforms consolidate onto fewer processors and boards, workloads that once lived on separate controllers increasingly share memory, devices, interrupts, and boot dependencies.
  - article:
    - heading "Separation as an engineering concern" [level=3]
    - paragraph: The hard problem is sharing hardware without blurring ownership, validation scope, fault-containment expectations, or lifecycle boundaries between platform responsibilities.
  - paragraph: Design principles
  - heading "Designed for platform separation" [level=2]
  - paragraph: Xen gives platform teams a clear boundary between shared hardware and guest systems, making separation decisions visible instead of burying them inside one operating system.
  - article:
    - heading "Isolation boundaries" [level=3]
    - paragraph: Reason about where guest systems are separated and where platform integration must be reviewed explicitly.
  - article:
    - heading "Guest ownership" [level=3]
    - paragraph: Keep the responsibilities of Linux guests, RTOS guests, service domains, and hardware-facing components visible.
  - article:
    - heading "Resource assignment" [level=3]
    - paragraph: Make CPU, memory, interrupt, and device assignment part of the platform design instead of implicit operating-system behavior.
  - article:
    - heading "Boot and integration" [level=3]
    - paragraph: Track startup order, control-domain choices, device setup, and integration responsibilities as first-class architecture decisions.
  - article:
    - heading "Platform control" [level=3]
    - paragraph: Separate hardware-facing platform control from guest application environments where the system design calls for that boundary.
  - article:
    - heading "Long-term maintainability" [level=3]
    - paragraph: Support product lifecycles where guest systems, platform software, and hardware assumptions may need to evolve at different rates.
  - paragraph: Technical capabilities
  - heading "Capabilities for mixed-criticality platform design" [level=2]
  - paragraph: Once the separation model is clear, platform teams can evaluate the Xen capabilities that make ownership, timing, device access, and boot architecture explicit.
  - article:
    - heading "CPU pinning" [level=3]
    - paragraph: Assign CPU resources deliberately so latency-sensitive guests and platform services have explicit execution ownership.
    - link "Read architecture overview":
      - /url: /technology/architecture
  - article:
    - heading "Deterministic interrupt latencies" [level=3]
    - paragraph: Design systems where interrupt routing, CPU assignment, and device ownership support deterministic interrupt latencies.
    - link "Review safety resources":
      - /url: /technology/safety
  - article:
    - heading "Device passthrough" [level=3]
    - paragraph: Assign selected hardware devices directly to guests when the system design calls for direct device ownership.
    - link "Review isolation overview":
      - /url: /technology/isolation-and-security
  - article:
    - heading "Dom0less boot" [level=3]
    - paragraph: Start selected guest domains without waiting for a traditional control domain boot path where the platform design calls for it.
    - link "Explore the hypervisor":
      - /url: /projects/hypervisor
  - article:
    - heading "Static resource partitioning" [level=3]
    - paragraph: Make CPU, memory, device, and interrupt ownership part of the platform design instead of implicit runtime behavior.
    - link "Review isolation overview":
      - /url: /technology/isolation-and-security
  - article:
    - heading "Flexible control domains" [level=3]
    - paragraph: Choose a control-domain model that fits the product architecture instead of assuming a single management pattern.
    - link "Read architecture overview":
      - /url: /technology/architecture
  - paragraph: Embedded platform breadth
  - heading "The same separation model applies across embedded domains." [level=2]
  - paragraph: Xen can be evaluated wherever teams need to combine hardware-facing software, guest operating systems, and long-lived platform requirements while keeping ownership, timing, and integration boundaries visible.

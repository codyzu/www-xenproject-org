- main:
  - paragraph: Solution Area
  - heading "Open source virtualization for embedded and automotive systems." [level=1]
  - paragraph: Build mixed-workload platforms on shared hardware while keeping system boundaries explicit, inspectable, and maintainable across long product lifecycles.
  - link "Explore Xen architecture":
    - /url: /technology/architecture
  - link "Start contributing":
    - /url: /contribute/get-started
  - paragraph: Platform layers
  - paragraph: Guest domains
  - text: Linux RTOS Services
  - paragraph: Xen hypervisor boundary
  - paragraph: Isolation, scheduling, device assignment, and platform control decisions stay visible.
  - paragraph: Hardware platform
  - paragraph: Compute, memory, interrupts, devices, and long-lived product integration.
  - paragraph: Why virtualization matters here
  - heading "Consolidate the platform without blurring the boundaries." [level=2]
  - paragraph: Embedded and automotive teams are asked to combine more software on shared compute while preserving the boundaries that make engineering, validation, and maintenance practical.
  - article:
    - heading "Shared hardware" [level=3]
    - paragraph: Run more platform software on fewer boards while keeping ownership and failure domains visible.
  - article:
    - heading "Mixed workloads" [level=3]
    - paragraph: Give Linux, RTOS workloads, service domains, and specialized systems a clearer place to coexist.
  - article:
    - heading "Explicit boundaries" [level=3]
    - paragraph: Keep devices, boot flow, interrupts, and integration responsibilities visible to platform teams.
  - article:
    - heading "Maintainable platforms" [level=3]
    - paragraph: Support architectures that can evolve across long hardware, software, and product lifecycles.
  - paragraph: Automotive focus
  - heading "A virtualization layer for software-defined vehicle platforms." [level=2]
  - paragraph: Automotive platforms increasingly combine Linux systems, RTOS workloads, service domains, and hardware-specific functions on shared compute. Xen gives platform teams a thin virtualization layer for reasoning about isolation, ownership, and system boundaries without treating one operating system as the whole platform.
  - article:
    - heading "ECU consolidation" [level=3]
    - paragraph: Keep platform boundaries explicit as vehicle functions move from many controllers toward shared compute.
  - article:
    - heading "Mixed workloads" [level=3]
    - paragraph: Evaluate how IVI, service domains, Linux, RTOS workloads, and hardware-facing functions can coexist.
  - complementary:
    - text: Evaluation note
    - heading "Certification work depends on product evidence." [level=3]
    - paragraph: Xen is relevant to safety-conscious platform evaluation, but this page does not claim product safety certification. Teams with certification requirements should evaluate code, process, evidence, and integration context for their product.
  - paragraph: Evaluation concerns
  - text: mixed-criticality workloads supplier coordination long-term maintenance hardware validation certification-aware work
  - paragraph: Embedded systems
  - heading "The automotive story builds on broader embedded virtualization foundations." [level=2]
  - paragraph: Xen can be evaluated anywhere teams need to combine hardware-facing software, guest operating systems, and long-lived platform requirements while keeping separation visible.

  - paragraph: Why Xen fits
  - heading "Built for engineers working close to the platform." [level=2]
  - paragraph: Xen is strongest where teams need to reason carefully about virtual machines, hardware, operating systems, and trust boundaries.
  - article:
    - heading "Thin hypervisor boundary" [level=3]
    - paragraph: Xen sits close to the hardware, giving teams a focused layer for separation and platform control.
    - link "Explore the hypervisor":
      - /url: /projects/hypervisor
  - article:
    - heading "Hardware-aware isolation" [level=3]
    - paragraph: Xen is designed around guest isolation and hardware-facing platform work rather than treating one operating system as the whole boundary.
    - link "Read isolation overview":
      - /url: /technology/isolation-and-security
  - article:
    - heading "Flexible guest model" [level=3]
    - paragraph: Xen supports systems where different operating environments need to share a platform while retaining separate responsibilities.
    - link "Read architecture overview":
      - /url: /technology/architecture
  - article:
    - heading "Open engineering model" [level=3]
    - paragraph: Governance, contribution paths, security handling, and testing resources are visible to teams evaluating the platform.
    - link "Read governance":
      - /url: /about/governance
  - paragraph: Relevant technologies and concepts
  - heading "Start with the concepts before choosing an integration path." [level=2]
  - paragraph: These concepts are useful starting points for an embedded or automotive evaluation. Detailed product claims should be checked against current upstream documentation and project evidence.
  - article:
    - paragraph: Dom0less
    - paragraph: A Xen configuration path for systems that benefit from starting guest domains without waiting for a traditional control domain boot path.
  - article:
    - paragraph: Device passthrough
    - paragraph: A platform integration tool for assigning selected hardware resources to guests when the system design calls for direct device access.
  - article:
    - paragraph: Hardware CI
    - paragraph: Xen CI includes real hardware validation, including Dom0, DomU, Dom0less, PCI passthrough, and suspend/resume scenarios.
  - article:
    - paragraph: Arm and platform support
    - paragraph: Existing Xen site content references Arm, ARM64, x86, RISC-V, and PowerPC work across project and CI material.
  - article:
    - paragraph: Safety-conscious process
    - paragraph: Existing project content references MISRA C work and safety-standard alignment efforts; product certification still requires separate evaluation.
  - article:
    - paragraph: Open source integration
    - paragraph: The embedded project has referenced work across Xen, Linux, OP-TEE, and RTOS environments such as Zephyr.
  - complementary:
    - heading "Treat detailed safety and real-time claims as verification work." [level=2]
    - paragraph: RTDS scheduling, IOMMU behavior, static partitioning, memory and interrupt separation, AGL ties, exact performance numbers, and formal certification status should be linked only after they are verified from current authoritative project material.
    - link "Review safety entry point":
      - /url: /technology/safety

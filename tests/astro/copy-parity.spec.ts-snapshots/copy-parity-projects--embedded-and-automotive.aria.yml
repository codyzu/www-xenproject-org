  - paragraph: Why virtualization matters here
  - heading "Consolidate the platform without blurring the boundaries." [level=2]
  - paragraph: Embedded and automotive teams need to combine more software on shared compute while preserving engineering, validation, and maintenance boundaries.
  - article:
    - heading "Shared hardware" [level=3]
    - paragraph: Run more platform software on fewer boards while keeping ownership and failure domains visible.
  - article:
    - heading "Mixed workloads" [level=3]
    - paragraph: Give Linux, RTOS workloads, service domains, and specialized systems clear places to coexist.
  - article:
    - heading "Explicit boundaries" [level=3]
    - paragraph: Keep devices, boot flow, interrupts, and integration responsibilities visible.
  - article:
    - heading "Maintainable platforms" [level=3]
    - paragraph: Support architectures that can evolve across long hardware, software, and product lifecycles.
  - paragraph: Mixed-criticality systems
  - heading "Why mixed-criticality matters" [level=2]
  - paragraph: Modern platforms combine workloads with different safety, timing, reliability, and maintenance needs. Mixed-criticality keeps attention on the boundaries between them, not just the shared hardware.
  - article:
    - heading "Different operating profiles" [level=3]
    - paragraph: Control workloads, RTOS workloads, Linux services, infotainment, diagnostics, and OTA services can have different timing, reliability, update, and validation needs.
  - article:
    - heading "Shared compute pressure" [level=3]
    - paragraph: As platforms consolidate onto fewer processors, workloads that once lived on separate controllers increasingly share memory, devices, interrupts, and boot paths.
  - article:
    - heading "Separation as an engineering concern" [level=3]
    - paragraph: The hard problem is sharing hardware without blurring ownership, validation scope, fault containment, or lifecycle boundaries.
  - paragraph: Design principles
  - heading "Designed for platform separation" [level=2]
  - paragraph: Xen gives platform teams a clear boundary between shared hardware and guest systems, keeping separation decisions visible.
  - article:
    - heading "Isolation boundaries" [level=3]
    - paragraph: Reason about where guests are separated and where integration must be reviewed explicitly.
  - article:
    - heading "Guest ownership" [level=3]
    - paragraph: Keep Linux guests, RTOS guests, service domains, and hardware-facing components accountable.
  - article:
    - heading "Resource assignment" [level=3]
    - paragraph: Make CPU, memory, interrupt, and device assignment explicit platform design choices.
  - article:
    - heading "Boot and integration" [level=3]
    - paragraph: Track startup order, control-domain choices, device setup, and integration responsibilities.
  - article:
    - heading "Platform control" [level=3]
    - paragraph: Separate hardware-facing control from guest application environments where needed.
  - article:
    - heading "Long-term maintainability" [level=3]
    - paragraph: Support lifecycles where guests, platform software, and hardware assumptions evolve at different rates.
  - paragraph: Technical capabilities
  - heading "Capabilities for mixed-criticality platform design" [level=2]
  - paragraph: Once the separation model is clear, teams can evaluate Xen capabilities for ownership, timing, device access, and boot architecture.
  - article:
    - heading "CPU pinning" [level=3]
    - paragraph: Assign CPU resources deliberately so latency-sensitive guests have explicit execution ownership.
    - link "Explore architecture":
      - /url: /technology/architecture
  - article:
    - heading "Deterministic interrupt latencies" [level=3]
    - paragraph: Design systems where interrupt routing, CPU assignment, and device ownership support deterministic interrupt latencies.
    - link "Review safety resources":
      - /url: /technology/safety
  - article:
    - heading "Device passthrough" [level=3]
    - paragraph: Assign selected hardware devices directly to guests when the design calls for direct ownership.
    - link "Review isolation resources":
      - /url: /technology/isolation-and-security
  - article:
    - heading "Dom0less boot" [level=3]
    - paragraph: Start selected guest domains without waiting for a traditional control-domain boot path.
    - link "Visit project":
      - /url: /projects/hypervisor
  - article:
    - heading "Static resource partitioning" [level=3]
    - paragraph: Make CPU, memory, device, and interrupt ownership part of the platform design.
    - link "Review isolation resources":
      - /url: /technology/isolation-and-security
  - article:
    - heading "Flexible control domains" [level=3]
    - paragraph: Choose a control-domain model that fits the architecture instead of assuming one pattern.
    - link "Explore architecture":
      - /url: /technology/architecture
  - paragraph: Embedded platform breadth
  - heading "The same separation model applies across embedded domains." [level=2]
  - paragraph: Xen can be evaluated wherever hardware-facing software, guest operating systems, and long-lived platform requirements share compute.

  - paragraph: Open platform ecosystem
  - heading "Building complete embedded platforms" [level=2]
  - paragraph: Most embedded products are built from multiple open source projects, not one operating system. Xen provides the virtualization and isolation boundary that lets Linux, Yocto Project, Zephyr, AGL, and platform software play complementary roles without hiding ownership or integration decisions.

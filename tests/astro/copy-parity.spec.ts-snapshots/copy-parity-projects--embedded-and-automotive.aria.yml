  - paragraph: Specialized hardware platforms
  - paragraph: Flagship embedded example
  - heading "Software-defined vehicles make the separation challenge concrete." [level=2]
  - paragraph: "Automotive platforms make the embedded challenge concrete: Linux systems, RTOS workloads, service domains, and hardware-specific functions increasingly share compute. Xen gives teams a thin layer for reasoning about isolation and ownership without treating one operating system as the whole platform."
  - article:
    - heading "ECU consolidation" [level=3]
    - paragraph: Keep boundaries explicit as vehicle functions move toward shared compute.
  - article:
    - heading "Mixed workloads" [level=3]
    - paragraph: Evaluate how IVI, service domains, Linux, RTOS workloads, and hardware-facing functions coexist.
  - complementary:
    - text: Safety engineering
    - heading "Safety work depends on system evidence." [level=3]
    - paragraph: Xen source code is not itself safety certified. Through the Xen Safety Committee, project participants collaborate on engineering practices, documentation, tooling, evidence, and supporting artifacts for safety-conscious and certification-oriented development. Product certification still depends on the complete system, process, integration context, and safety case.
  - paragraph: Process tooling
  - paragraph: The project also collaborates with BUGSENG on static analysis with ECLAIR, supporting MISRA C compliance efforts and ongoing code quality improvement.
  - complementary:
    - text: Reference architecture spotlight
    - heading "Automotive Grade Linux shows the stack in practice." [level=2]
    - paragraph: Automotive Grade Linux's Software Defined Vehicle reference architecture shows how Xen, Linux, Zephyr, platform services, and vehicle applications can fit together in a broader open automotive stack. It offers a concrete industry example of these separation and platform-composition concepts without prescribing a single Xen architecture.
    - link "Explore the AGL SDV architecture":
      - /url: https://www.automotivelinux.org/announcements/sodev/
  - paragraph: Why architects choose Xen
  - heading "Evaluation starts with architecture, evidence, and integration context." [level=2]
  - paragraph: After the separation model is clear, teams can evaluate Xen through architecture, isolation resources, guest model, governance, and public engineering process.
  - article:
    - heading "Thin hypervisor boundary" [level=3]

      - strong: Development
      - text: process
    - paragraph: XCP-ng is actively developed by a dedicated team of engineers, alongside a growing community of contributors. Our documentation details the development process and how you can get involved—through testing, feedback, or code contributions. The current LTS version is XCP-ng 8.3.

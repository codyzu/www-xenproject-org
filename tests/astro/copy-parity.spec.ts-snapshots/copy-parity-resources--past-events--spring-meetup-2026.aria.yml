- main:
  - article:
    - heading "Xen Spring Meetup 2026" [level=1]
    - text: The Xen Project Spring Meetup is a two-day, in-person community event in Grenoble, France.
    - img "Xen Spring Meetup 2026"
    - heading "Registration is open" [level=3]
    - paragraph:
      - text: Join us in Grenoble on
      - strong: April 2–3, 2026
      - text: for two days of Xen collaboration, research exchange, and community connection.
    - paragraph:
      - strong: "Tickets:"
      - text: $80 USD in-person · $20 USD virtual · $20 USD student. Seats are limited.
    - link "Register now":
      - /url: https://linuxfoundation.regfox.com/xen-spring-meetup-2026
    - link "View schedule":
      - /url: https://xenspringmeetup2026.sched.com
    - heading "Xen Spring Meetup 2026" [level=2]
    - paragraph: A two-day, in-person gathering for Xen developers, users, researchers, and ecosystem partners in Grenoble, France.

      - code: VATES
      - strong: "Room block:"
      - text: April 1–4, 2026
      - strong: "Book by:"
      - text: March 1, 2026
    - list:
      - listitem: 99 EUR standard single
      - listitem: 109 EUR standard double
      - listitem: 129 EUR superior single
      - listitem: 139 EUR superior double
    - paragraph:
      - text: Breakfast is included.
      - link "Hotel website":
        - /url: https://www.hotel-angleterre-grenoble.com
    - heading "Why Grenoble?" [level=2]
    - paragraph: Grenoble has a long tradition of excellence in research, open collaboration, and systems engineering. Hosting the meetup at Université Grenoble Alpes strengthens ties between industry, academia, and the open-source community.
    - heading "Thank You to Our Sponsors" [level=2]
    - paragraph: Special thanks to local co-organizers Fabienne Boyer and Alain Tchana from KrakOS (Inria / LIG / CNRS).

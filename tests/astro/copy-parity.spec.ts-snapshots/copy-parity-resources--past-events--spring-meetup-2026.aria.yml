      - /url: https://linuxfoundation.regfox.com/xen-spring-meetup-2026
    - heading "Travel" [level=3]
    - paragraph: Grenoble is well connected by train via Lyon and reachable from major European cities.
    - heading "Official hotel" [level=4]
    - paragraph: A discounted room block is available at Hôtel d’Angleterre Grenoble.
    - heading "Accommodation" [level=2]
    - paragraph:
      - text: A discounted room block is available at
      - strong: Hôtel d’Angleterre Grenoble
      - text: in the city center.
    - paragraph:

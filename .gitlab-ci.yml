---

workflow:
  # Avoid duplicate pipelines for merge requests (for pushes and merge requests)
  # See: https://docs.gitlab.com/ci/yaml/workflow/#switch-between-branch-pipelines-and-merge-request-pipelines
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  # Pin Node explicitly because the Astro build relies on Node 24's
  # built-in TypeScript stripping for scripts that import .ts modules directly.
  image: node:24.16.0-bookworm

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  HUGO_ENV: production
  SITE_URL: https://beta.xenproject.org
  # Shallow clones are sufficient for the Astro build and validation jobs.
  GIT_DEPTH: 1
  GIT_SUBMODULE_DEPTH: 1

test:
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run downloads
    - npm run build
    - node scripts/astro/check-public-artifact.js public --standalone
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

# Artifact will be deployed to https://beta.xenproject.org/
deploy:
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run downloads
    - npm run build
    - node scripts/astro/check-public-artifact.js public --standalone
    - tar caf site.tar.gz public
  artifacts:
    paths:
      - site.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

copy-parity:
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
    - npm run build
    - npm run test:astro:copy-parity
  artifacts:
    when: always
    paths:
      - playwright-report/
      - tests/astro-results/
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

# The production host downloads this artifact after a merge to the default
# branch. Build it with the production origin so canonical, social, redirect,
# and RSS URLs point to https://xenproject.org/.
publish:
  variables:
    SITE_URL: https://xenproject.org
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run downloads
    - npm run build
    - node scripts/astro/check-public-artifact.js public --standalone
    - tar caf site.tar.gz public
  artifacts:
    paths:
      - site.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

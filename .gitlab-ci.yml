---

workflow:
  # Avoid duplicate pipelines for merge requests (for pushes and merge requests)
  # See: https://docs.gitlab.com/ci/yaml/workflow/#switch-between-branch-pipelines-and-merge-request-pipelines
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  # Pin Node explicitly because the Astro build relies on Node 24's
  # built-in TypeScript stripping for scripts that import .ts modules directly.
  image: node:24.16.0-bookworm

stages:
  - build
  - test
  - publish

variables:
  # Build one production-origin artifact for beta validation and production.
  # Keeping the origin stable means the archive promoted after Playwright is
  # byte-for-byte the archive that was tested.
  SITE_URL: https://xenproject.org
  # Shallow clones are sufficient for the Astro build and validation jobs.
  GIT_DEPTH: 1

test:
  stage: build
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm run check
    - npm run build
    - npm run check:dist
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

# Build the production artifact once. It is deployed to beta for validation,
# exercised by Playwright, and promoted unchanged to production.
deploy:
  stage: build
  variables:
    GHOST_CONTENT_REQUIRED: "1"
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm run check
    - |
      if [ "$SEARCH_GHOST_SOURCE" = "fixture" ]; then
        echo "WARNING: Protected Ghost variables are unavailable to this fork merge request; using synthetic Blog search records."
        npm run search:fixture
      else
        npm run search:refresh
      fi
    - npm run build
    - npm run check:dist
    # Preserve the public/ archive root expected by the beta deployment hook.
    - mkdir .deployment-artifact
    - mv dist .deployment-artifact/public
    - tar caf site.tar.gz -C .deployment-artifact public
    - sha256sum site.tar.gz
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - site.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        SEARCH_GHOST_SOURCE: live
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_MERGE_REQUEST_PROJECT_ID
      variables:
        SEARCH_GHOST_SOURCE: fixture
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        SEARCH_GHOST_SOURCE: live
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

# Run the focused browser suite against the exact artifact produced above.
# The image version must match @playwright/test in package.json.
playwright:high-value:
  stage: test
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  needs:
    - job: deploy
      artifacts: true
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - mkdir .playwright-site
    - tar xf site.tar.gz -C .playwright-site
    - mv .playwright-site/public dist
    - npm run test:e2e:high-value
    # Re-index the copied artifact with synthetic records for deterministic search UI coverage.
    - npm run test:e2e:search
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - tests/astro-results/
      - junit.xml
    reports:
      junit: junit.xml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

# The production host downloads the artifact exposed by this job after a merge
# to the default branch. Re-publish the archive built above without modifying
# it so production receives the exact bytes exercised by Playwright.
publish:
  stage: publish
  # This job only verifies and re-exposes an upstream artifact. BusyBox
  # provides the required shell and sha256sum without pulling the Node image,
  # and no repository checkout is needed.
  image: busybox:1.38.0-musl
  variables:
    GIT_STRATEGY: none
  needs:
    - job: deploy
      artifacts: true
    - job: playwright:high-value
      artifacts: false
  script:
    - test -f site.tar.gz
    - sha256sum site.tar.gz
  artifacts:
    paths:
      - site.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

---

workflow:
  # Avoid duplicate pipelines for merge requests (for pushes and merge requests)
  # See: https://docs.gitlab.com/ci/yaml/workflow/#switch-between-branch-pipelines-and-merge-request-pipelines
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  # Pin Node explicitly because the Astro build relies on Node 24's
  # built-in TypeScript stripping for scripts that import .ts modules directly.
  image: node:24.16.0-bookworm

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  HUGO_ENV: production
  SITE_URL: https://beta.xenproject.org
  # Use shallow clones by default; only the legacy publish job needs history.
  GIT_DEPTH: 1
  GIT_SUBMODULE_DEPTH: 1

test:
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
    - node scripts/astro/check-public-artifact.js public --standalone
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

# Artifact will be deployed to https://beta.xenproject.org/
deploy:
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
    - node scripts/astro/check-public-artifact.js public --standalone
    - tar caf site.tar.gz public
  artifacts:
    paths:
      - site.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

# Artifact will be published to https://xenproject.org/. Keep this job on the
# explicit legacy path until the Astro beta acceptance gate has passed.
publish:
  variables:
    # Full git history required so Hugo can compute per-page lastmod correctly
    GIT_DEPTH: 0
    GIT_SUBMODULE_DEPTH: 0
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm exec hugo -- version
    - npm run lint
    - node scripts/downloads/getLinks.js
    - npm run build:legacy -- -- --baseURL "https://xenproject.org/"
    - tar caf site.tar.gz public
  artifacts:
    paths:
      - site.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    - key: npm-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - npm-cache-$CI_DEFAULT_BRANCH
        - npm-cache-default
      paths:
        - .npm/

<div class="uno-flex uno-justify-center">
  <div class="uno-text-center uno-surface-brand uno-gap-10">
    <h2 class="uno-text-xl uno-font-semibold">Xen CI Pipeline</h2>

    <!-- Step 1: Developer -->
    <div class="uno-flex uno-flex-col uno-items-center">
      <span class="i-mdi-source-branch uno-text-6xl uno-text-action" aria-hidden="true"></span>
      <p class="uno-mt-2">Developer pushes code</p>
    </div>

    <!-- Arrow -->
    <span class="i-fa6-solid-arrow-down-long uno-text-4xl uno-text-action" aria-hidden="true"></span>

    <div class="uno-flex uno-gap-2">
      <!-- Step 2: GitLab Pipeline -->
      <div class="uno-flex uno-flex-col uno-items-center">
        <span class="i-logos-gitlab uno-text-6xl" aria-hidden="true"></span>
        <p class="uno-mt-2">GitLab Pipeline Triggered</p>
      </div>
      <div class="uno-flex uno-flex-col uno-items-center">
        <span class="i-logos-cirrus-ci uno-text-6xl" aria-hidden="true"></span>
        <p class="uno-mt-2">Cirrus CI Pipeline Triggered</p>
      </div>
    </div>

    <!-- Arrow -->
    <span class="i-fa6-solid-arrow-down-long uno-text-4xl uno-text-action" aria-hidden="true"></span>

    <!-- Step 3: Build -->
    <div class="uno-flex uno-flex-col uno-items-center">
      <span class="i-logos-docker-icon uno-text-6xl" aria-hidden="true"></span>
      <p class="uno-mt-2">Build Job<br />(x86, ARM64)</p>
    </div>

    <!-- Arrow -->
    <span class="i-fa6-solid-arrow-down-long uno-text-4xl uno-text-action" aria-hidden="true"></span>

    <!-- Step 4: Parallel test jobs -->
    <div class="uno-flex uno-space-x-12">
      <!-- QEMU -->
      <div class="uno-flex uno-flex-col uno-items-center">
        <span class="i-carbon-virtual-machine uno-text-6xl uno-text-action" aria-hidden="true"></span>
        <p class="uno-mt-2">QEMU Test Job</p>
      </div>

      <!-- Hardware -->
      <div class="uno-flex uno-flex-col uno-items-center">
        <span class="i-bi-motherboard uno-text-6xl uno-text-action" aria-hidden="true"></span>
        <p class="uno-mt-2">Hardware Test Job</p>
      </div>
    </div>

    <!-- Arrow -->
    <span class="i-fa6-solid-arrow-down-long uno-text-4xl uno-text-action" aria-hidden="true"></span>

    <!-- Step 5: Serial Check -->
    <div class="uno-flex uno-flex-col uno-items-center">
      <span class="i-mdi-file-document-check-outline uno-text-6xl uno-text-action" aria-hidden="true"></span>
      <p class="uno-mt-2">Serial Output Checked<br />Result: Pass/Fail</p>
    </div>
  </div>
</div>

{{ $content := .Inner | markdownify }}
{{ if .IsNamedParams }}
  {{ $class := .Get "class" }}
  {{ $container := .Get "container" }}
  <div class="{{ with $class }}{{ . }}{{ end }}{{ with $container }}container container-{{ . }}{{ end }}">
    {{ $content }}
  </div>
{{ else }}
  {{ $content }}
{{ end }}

{{ define "bodyClass" }}page-content-only{{ end }}
{{ define "main" }}
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ if .Description }}
      <div class="description">
        {{ .Description }}
      </div>
    {{ end }}
  </div>

  <div class="single-content">
    <section class="container-small content-markdown">
      {{ .Content }}
    </section>
  </div>
  {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
{{ end }}
